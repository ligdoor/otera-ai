<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>項目設定</title>
<style>
        body { font-family: sans-serif; margin: 0; padding: 10px; background-color: #f4f6f8; color: #333; }
        
        /* ヘッダー：スマホでも綺麗に並ぶように調整 */
        .header-area { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #1a237e; padding-bottom: 10px; margin-bottom: 20px;
        }
        h1 { color: #1a237e; margin: 0; font-size: 1.2rem; }
        .back-link { 
            text-decoration: none; color: #1a237e; font-weight: bold; 
            border: 1px solid #1a237e; padding: 8px 12px; border-radius: 4px; background: white; font-size: 0.9rem; white-space: nowrap;
        }
        
        .field-list { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        
        /* 項目リスト：横スクロールしないように幅を自動調整 */
        .field-item { 
            display: flex; gap: 5px; align-items: center; padding: 10px 0; 
            border-bottom: 1px solid #eee; background: #fff; 
        }
        .field-item:last-child { border-bottom: none; }
        
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        
        /* キー入力欄：少し狭く */
        .key-input { width: 80px; background: #f0f0f0; color: #555; flex-shrink: 0; }
        
        /* ラベル入力欄：残りの幅を全部使う */
        .label-input { 
            flex-grow: 1; 
            width: auto; /* 幅指定をリセット */
            min-width: 0; /* はみ出し防止 */
        }        
        /* ハンバーガーアイコン */
        .handle { cursor: grab; font-size: 1.2rem; color: #aaa; margin-right: 5px; flex-shrink: 0; }
        
        /* 削除ボタン：サイズを強力に固定 */
        .del-btn { 
            background: #c62828; color: white; border: none; padding: 0; 
            width: 40px !important; /* !important で強制的に幅を固定 */
            height: 40px !important; 
            border-radius: 4px; cursor: pointer; 
            flex-shrink: 0; /* 絶対に縮めない */
            font-weight: bold; font-size: 1.5rem; line-height: 1;
            display: flex; justify-content: center; align-items: center; /* バツ印を真ん中に */
        }
                
        .add-area { margin-top: 20px; padding-top: 20px; border-top: 2px dashed #ddd; }
        
        /* 追加エリアの入力欄も横並びに */
        .add-inputs { display: flex; gap: 5px; margin-bottom: 10px; }
        .add-inputs input { width: 50%; }

        .btn { padding: 10px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; width: 100%; box-sizing: border-box; }
        .save-btn { background: #2e7d32; margin-top: 20px; font-size: 1.1rem; }
        .add-btn { background: #1a237e; }

    </style>
</head>
<body>

<div class="header-area">
    <h1>表示項目の設定</h1>
    <a href="/admin" class="back-link">← 管理画面へ</a>
</div>

<div class="field-list">
    <p>項目の追加・削除・並び替えができます。<br>※IDは必ず半角英字</p>
    <div id="fields-container">
        <!-- ここに項目が並ぶ -->
    </div>

<div class="add-area">
        <h3>新規項目追加</h3>
        <div class="add-inputs">
            <input type="text" id="new-key" placeholder="ID (例: parking)">
            <input type="text" id="new-label" placeholder="表示名 (例: 駐車場)">
        </div>
        <button class="btn add-btn" onclick="addField()">追加</button>
    </div>

    <button class="btn save-btn" onclick="saveFields()">設定を保存する</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
    let fields = [];

    // 初期ロード
    fetch('/get_fields')
        .then(res => res.json())
        .then(data => {
            fields = data;
            render();
        });

    function render() {
        const container = document.getElementById('fields-container');
        container.innerHTML = '';
        
        fields.forEach((f, index) => {
            const div = document.createElement('div');
            div.className = 'field-item';
            // name は削除不可
            const isFixed = f.key === 'name';
            const delBtn = isFixed ? '' : `<button class="btn del-btn" onclick="removeField(${index})">×</button>`;
            const readOnly = isFixed ? 'readonly' : '';
            
            div.innerHTML = `
                <span class="handle">☰</span>
                <input type="text" class="key-input" value="${f.key}" readonly>
                <input type="text" class="label-input" value="${f.label}" onchange="updateLabel(${index}, this.value)">
                ${delBtn}
            `;
            container.appendChild(div);
        });
    }

    // 並び替えライブラリ (SortableJS)
    new Sortable(document.getElementById('fields-container'), {
        handle: '.handle',
        animation: 150,
        onEnd: function (evt) {
            const item = fields.splice(evt.oldIndex, 1)[0];
            fields.splice(evt.newIndex, 0, item);
        }
    });

    function addField() {
        const key = document.getElementById('new-key').value.trim();
        const label = document.getElementById('new-label').value.trim();
        if(!key || !label) return alert("IDと表示名を入力してください");
        
        // 重複チェック
        if(fields.some(f => f.key === key)) return alert("そのIDは既に使われています");

        fields.push({ key: key, label: label, order: fields.length + 1 });
        document.getElementById('new-key').value = '';
        document.getElementById('new-label').value = '';
        render();
    }

    function removeField(index) {
        if(!confirm("この項目を表示から削除しますか？\n(データ自体は消えません)")) return;
        fields.splice(index, 1);
        render();
    }

    function updateLabel(index, val) {
        fields[index].label = val;
    }

    async function saveFields() {
        // orderを再割り当て
        fields.forEach((f, i) => f.order = i + 1);
        
        if(!confirm("設定を保存して反映しますか？")) return;

        const res = await fetch('/update_fields', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ fields: fields })
        });

        if(res.ok) {
            alert("保存しました！");
            location.reload();
        } else {
            alert("エラーが発生しました");
        }
    }
</script>
</body>
</html>
