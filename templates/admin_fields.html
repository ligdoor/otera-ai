<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>項目設定</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <style>
        /* ============================================
           ドラッグ＆ドロップ UX改善スタイル
           ============================================ */

        /* 掴んでいる行（chosen）: 影を付けて浮いているように見せる */
        .sortable-chosen {
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
            border: 2px solid var(--color-primary) !important;
            border-radius: var(--radius-md);
            background: #eef1ff !important;
            opacity: 1 !important;
            cursor: grabbing !important;
            transform: scale(1.02);
            z-index: 999;
        }

        /* ゴースト（ドロップ先のプレースホルダー）: 青い点線で挿入位置を示す */
        .sortable-ghost {
            opacity: 0;
            background: transparent !important;
            border: 2.5px dashed var(--color-primary) !important;
            border-radius: var(--radius-md);
            box-shadow: none !important;
            position: relative;
        }

        /* ゴーストの上に「ここに挿入」ラベルを表示 */
        .sortable-ghost::after {
            content: "▶ ここに移動";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.8rem;
            color: var(--color-primary);
            font-weight: bold;
            white-space: nowrap;
            opacity: 0.8;
        }

        /* ドラッグハンドル: カーソルを grab に */
        .drag-handle {
            cursor: grab;
            font-size: 1.2rem;
            padding: 4px 6px;
            border-radius: 4px;
            color: var(--color-gray-400);
            transition: color 0.15s, background 0.15s;
            user-select: none;
        }
        .drag-handle:hover {
            color: var(--color-primary);
            background: var(--color-primary-light);
        }
        .drag-handle:active {
            cursor: grabbing;
            color: var(--color-primary);
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <h1>
            <span>⚙️</span>
            表示項目の設定
        </h1>
        <a href="/admin" class="header-btn">
            <span>←</span>
            <span>管理画面へ</span>
        </a>
    </div>
</header>

<main>
    <div class="info-box">
        <h3>
            <span>💡</span>
            使い方
        </h3>
        <p>• <strong>☰</strong> をドラッグして項目の順番を入れ替えできます</p>
        <p>• <strong>name（寺院名）</strong>は削除・並び替えができません</p>
        <p>• IDは半角英数字のみで入力してください（例: parking, notes）</p>
    </div>

    <div class="field-container">
        <h3>
            <span>📋</span>
            現在の項目
        </h3>
        <div id="fields-container">
            <!-- ここに項目が並ぶ -->
        </div>
    </div>

    <div class="add-area">
        <h3>
            <span>➕</span>
            新規項目を追加
        </h3>
        <div class="add-inputs">
            <input type="text" id="new-key" class="add-input" placeholder="ID (例: parking, fee)" pattern="[a-zA-Z0-9_]+" title="半角英数字とアンダースコアのみ">
            <input type="text" id="new-label" class="add-input" placeholder="表示名 (例: 駐車場, 費用)">
        </div>
        <p class="help-text">
            <span>ℹ️</span>
            IDは項目の識別に使用されます。変更すると既存データとの紐付けが解除されます。
        </p>
        <button class="btn btn-add" onclick="addField()">
            <span>➕</span>
            項目を追加
        </button>
    </div>

    <button class="btn btn-save" onclick="saveFields()">
        <span>💾</span>
        設定を保存する
    </button>
</main>

<!-- トースト通知 -->
<div id="toast" class="toast">
    <span id="toast-icon">✅</span>
    <span id="toast-message">保存しました</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script>
    let fields = [];
    let hasChanges = false;

    // 初期ロード
    async function init() {
        try {
            const res = await fetch('/get_fields');
            fields = await res.json();
            render();
        } catch (e) {
            showToast('❌', 'データの読み込みに失敗しました', true);
        }
    }
    init();

    function render() {
        const container = document.getElementById('fields-container');
        container.innerHTML = '';
        
        if (fields.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <p>項目がありません</p>
                </div>
            `;
            return;
        }
        
        fields.forEach((f, index) => {
            const div = document.createElement('div');
            div.className = 'field-item';
            div.dataset.index = index;
            
            const isFixed = f.key === 'name';
            if (isFixed) {
                div.classList.add('locked');
            }
            
            const deleteBtn = isFixed 
                ? `<span class="lock-badge"><span>🔒</span>必須</span>` 
                : `<button class="delete-btn" onclick="removeField(${index})" title="削除">🗑️</button>`;
            
            const readOnly = isFixed ? 'disabled' : '';
            const draggable = isFixed ? '' : '☰';
            
            div.innerHTML = `
                <span class="drag-handle">${draggable}</span>
                <div class="field-inputs">
                    <input type="text" class="key-input" value="${f.key}" ${readOnly} readonly title="ID (変更不可)">
                    <input type="text" class="label-input" value="${f.label}" 
                           onchange="updateLabel(${index}, this.value)" 
                           placeholder="表示名を入力"
                           ${isFixed ? '' : ''}>
                </div>
                ${deleteBtn}
            `;
            container.appendChild(div);
        });

        // SortableJSを初期化（name以外をソート可能に）
        new Sortable(container, {
            handle: '.drag-handle',
            animation: 200,
            ghostClass: 'sortable-ghost',    // ドロップ先のプレースホルダー
            chosenClass: 'sortable-chosen',  // 掴んでいる行
            dragClass: 'sortable-drag',      // ドラッグ中の実体
            filter: '.locked',
            onMove: function(evt) {
                return !evt.related.classList.contains('locked');
            },
            onEnd: function (evt) {
                if (evt.oldIndex === evt.newIndex) return;
                
                // name を除外して並び替え
                const nameField = fields.find(f => f.key === 'name');
                const otherFields = fields.filter(f => f.key !== 'name');
                
                const item = otherFields.splice(evt.oldIndex - 1, 1)[0];
                otherFields.splice(evt.newIndex - 1, 0, item);
                
                fields = [nameField, ...otherFields];
                hasChanges = true;
                showToast('↕️', '順番を変更しました（保存してください）', false, 2000);
            }
        });
    }

    function addField() {
        const keyInput = document.getElementById('new-key');
        const labelInput = document.getElementById('new-label');
        const key = keyInput.value.trim();
        const label = labelInput.value.trim();
        
        // バリデーション
        if (!key || !label) {
            showToast('⚠️', 'IDと表示名を入力してください', true);
            return;
        }
        
        // ID形式チェック（英数字とアンダースコアのみ）
        if (!/^[a-zA-Z0-9_]+$/.test(key)) {
            showToast('⚠️', 'IDは半角英数字とアンダースコアのみ使用できます', true);
            return;
        }
        
        // 重複チェック
        if (fields.some(f => f.key === key)) {
            showToast('⚠️', 'そのIDは既に使われています', true);
            keyInput.focus();
            return;
        }

        // 追加
        fields.push({ 
            key: key, 
            label: label, 
            order: fields.length + 1 
        });
        
        keyInput.value = '';
        labelInput.value = '';
        keyInput.focus();
        
        hasChanges = true;
        render();
        showToast('✅', `「${label}」を追加しました（保存してください）`, false, 2000);
    }

    function removeField(index) {
        const field = fields[index];
        
        if (!confirm(`「${field.label}」を削除しますか？\n\n※データ自体は削除されず、表示されなくなるだけです。`)) {
            return;
        }
        
        fields.splice(index, 1);
        hasChanges = true;
        render();
        showToast('🗑️', `「${field.label}」を削除しました（保存してください）`, false, 2000);
    }

    function updateLabel(index, val) {
        if (fields[index].label !== val) {
            fields[index].label = val;
            hasChanges = true;
        }
    }

    async function saveFields() {
        if (!hasChanges) {
            showToast('ℹ️', '変更がありません', false, 2000);
            return;
        }

        // orderを再割り当て
        fields.forEach((f, i) => f.order = i + 1);
        
        if (!confirm("💾 設定を保存して反映しますか？")) return;

        try {
            const res = await fetch('/update_fields', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ fields: fields })
            });

            if (res.ok) {
                hasChanges = false;
                showToast('✅', '保存しました！', false, 3000);
                setTimeout(() => {
                    location.reload();
                }, 1500);
            } else {
                showToast('❌', '保存に失敗しました', true);
            }
        } catch (e) {
            showToast('❌', '通信エラーが発生しました', true);
        }
    }

    // トースト通知
    function showToast(icon, message, isError = false, duration = 3000) {
        const toast = document.getElementById('toast');
        const toastIcon = document.getElementById('toast-icon');
        const toastMessage = document.getElementById('toast-message');
        
        toastIcon.textContent = icon;
        toastMessage.textContent = message;
        toast.style.background = isError ? '#d32f2f' : '#323232';
        
        toast.classList.add('show');
        
        setTimeout(() => {
            toast.classList.remove('show');
        }, duration);
    }

    // Enterキーで追加
    document.getElementById('new-label').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addField();
        }
    });
    document.getElementById('new-key').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('new-label').focus();
        }
    });

    // ページ離脱時の確認
    window.addEventListener('beforeunload', function(e) {
        if (hasChanges) {
            e.preventDefault();
            e.returnValue = '保存していない変更があります。ページを離れますか？';
        }
    });
</script>
</body>
</html>
