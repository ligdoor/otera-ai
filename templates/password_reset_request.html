<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスワードリセット - 寺院管理システム</title>
    
    <!-- 新CSS構成 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
    
    <style>
        .info-text {
            background: var(--color-primary-light);
            padding: var(--spacing-lg);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-xl);
            font-size: var(--font-sm);
            line-height: 1.6;
            text-align: left;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="lock-icon">🔐</div>
        <h2>パスワードリセット</h2>
        <p class="subtitle">寺院管理システム</p>
        
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}
        
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        {% if not success %}
            <p class="info-text">
                📧 登録されているメールアドレスを入力してください。<br>
                パスワードリセット用のリンクをお送りします。
            </p>

            <form method="POST" action="/password-reset-request">
                <div class="form-group">
                    <label class="form-label" for="email">メールアドレス</label>
                    <input type="email" id="email" name="email" class="form-input" required 
                           placeholder="example@example.com"
                           autocomplete="email">
                </div>
                
                <button type="submit" class="btn btn-primary btn-full">
                    📧 リセットメールを送信
                </button>
            </form>
        {% endif %}

        <a href="/admin" class="btn btn-text btn-full" style="margin-top: var(--spacing-xl); justify-content: center;">
            ← ログイン画面に戻る
        </a>
    </div>
</body>
</html>
