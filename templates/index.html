<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺院情報データベース</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/tabs.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/font-size.css') }}">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <meta name="theme-color" content="#667eea">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='icons/icon-192.png') }}">
</head>
<body>

<!-- ヘッダー -->
{% include 'components/app_header.html' %}

<!-- クリアボタン（トップページのみ） -->
<button class="clear-chat-btn" onclick="clearAllChat()">🗑️ クリア</button>

<!-- チャットウィンドウ -->
<div id="chat-window" onclick="hideMenu()">
    <div class="message ai-message" style="margin-top: 20px;">
        {% if session.get('user_name') %}
            <p><span id="greeting-icon">👋</span> <strong id="greeting-text"></strong><br>寺院名を選択して詳細情報を確認できます。</p>
        {% else %}
            <p>👋 <strong>ようこそ！</strong><br>寺院名を選択して詳細情報を確認できます。</p>
        {% endif %}
    </div>
</div>

<!-- コントロールエリア -->
{% include 'components/control_area.html' %}

<!-- 通知モーダル -->
{% include 'components/notification_modal.html' %}

<!-- JavaScript -->
<script src="{{ url_for('static', filename='js/app/main.js') }}"></script>
<script src="{{ url_for('static', filename='js/app/search.js') }}"></script>
<script src="{{ url_for('static', filename='js/app/favorites.js') }}"></script>
<script src="{{ url_for('static', filename='js/app/notifications.js') }}"></script>
<script src="{{ url_for('static', filename='js/app/voice.js') }}"></script>

<!-- 時間帯別挨拶 -->
{% if session.get('user_name') %}
<script>
    // 時間帯に応じた挨拶
    const hour = new Date().getHours();
    const userName = "{{ session.get('user_name') }}";
    const greetingText = document.getElementById('greeting-text');
    const greetingIcon = document.getElementById('greeting-icon');
    
    if (hour >= 5 && hour < 11) {
        greetingText.textContent = `おはようございます、${userName}さん！`;
        greetingIcon.textContent = '🌅';
    } else if (hour >= 11 && hour < 17) {
        greetingText.textContent = `こんにちは、${userName}さん！`;
        greetingIcon.textContent = '☀️';
    } else if (hour >= 17 && hour < 21) {
        greetingText.textContent = `こんばんは、${userName}さん！`;
        greetingIcon.textContent = '🌆';
    } else {
        greetingText.textContent = `お疲れ様です、${userName}さん！`;
        greetingIcon.textContent = '🌙';
    }
</script>
{% endif %}

<!-- Service Worker -->
<script>
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/service-worker.js')
        .then(reg => console.log('✅ Service Worker registered'))
        .catch(err => console.log('❌ Service Worker error:', err));
}
</script>

</body>

</html>
