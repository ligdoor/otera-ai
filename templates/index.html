<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺院情報管理システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
<header>
    <div class="header-content">
        <button class="header-btn" onclick="toggleDarkMode()">🌙</button>
        <h1>🏯 寺院情報データベース</h1>
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="color: white; font-size: 14px;">👤 {{ user_name }}</span>
            <a href="/admin" class="header-btn">⚙️</a>
            <a href="/logout" class="header-btn" onclick="return confirm('ログアウトしますか？')">🚪</a>
        </div>
    </div>
</header>

<button class="clear-chat-btn" onclick="clearAllChat()">🗑️ クリア</button>

<div id="chat-window" onclick="hideMenu()">
    <div class="message ai-message">
        <p>👋 <strong>ようこそ！</strong><br>寺院名を選択して詳細情報を確認できます。</p>
    </div>
</div>

<button id="show-menu-btn" onclick="showMenu()">🔍</button>

<div class="control-area" id="control-area">
    <div class="close-handle" onclick="hideMenu()"></div>
    <div class="control-group">
        <div class="favorites-toggle">
            <button class="fav-tab active" onclick="switchTab('all')">🏯 すべて</button>
            <button class="fav-tab" onclick="switchTab('favorites')">⭐ お気に入り</button>
        </div>

        <div>
            <span class="label-text"><span>🔍</span>寺院検索（詳細表示）</span>
            <div class="custom-select-wrapper">
                <select id="temple-select" onchange="onTempleSelect()">
                    <option value="">寺院を選択...</option>
                </select>
            </div>
        </div>

        <div>
            <span class="label-text"><span>📿</span>宗派別リスト</span>
            <div class="custom-select-wrapper">
                <select id="sect-select" onchange="onSectSelect()">
                    <option value="">宗派を選択...</option>
                </select>
            </div>
        </div>
        
        <div>
            <span class="label-text"><span>💬</span>項目確認</span>
            <div id="quick-qa-area">
                <div class="qa-chip" onclick="askQuick('納棺の注意点は？')">⚰️ 納棺仕様</div>
                <div class="qa-chip" onclick="askQuick('書き物の指定は？')">🖊️ 書き物</div>
                <div class="qa-chip" onclick="askQuick('式の流れは？')">📜 式の流れ</div>
                <div class="qa-chip" onclick="askQuick('搬送時の持ち物は？')">🚗 搬送持ち物</div>
                <div class="qa-chip" onclick="askQuick('注意事項は？')">⚠️ 注意事項</div>
            </div>
            <div class="text-input-wrapper">
                <input type="text" id="free-input" placeholder="確認事項を入力" onkeypress="if(event.key === 'Enter') sendFreeChat()">
                <button id="voiceBtn" onclick="startVoiceInput()" 
                        style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
                            color: white; border: none; border-radius: 8px; 
                            padding: 8px 12px; font-size: 18px; cursor: pointer; 
                            margin: 0 4px; transition: transform 0.2s;"
                        title="音声入力">🎤</button>
                <button class="send-btn" onclick="sendFreeChat()">📤 確認</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const controlArea = document.getElementById('control-area');
    const showMenuBtn = document.getElementById('show-menu-btn');
    const quickQaArea = document.getElementById('quick-qa-area');
    
    let currentTempleName = "";
    let favorites = [];

    // ページ読み込み時にサーバーからお気に入りを取得
    async function loadFavorites() {
        try {
            const res = await fetch('/api/favorites');
            if (res.status === 401) {
                // 未認証の場合はログインページにリダイレクト
                window.location.href = '/admin';
                return;
            }
            const data = await res.json();
            favorites = data.favorites || [];
            updateTempleSelect();
        } catch (e) {
            console.error('お気に入り取得エラー:', e);
            favorites = [];
        }
    }    
    let currentTab = 'all';
    let allTemples = [];

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

    window.onload = async function() {
        await loadFavorites(); 
        try {
            const tRes = await fetch('/get_temple_names');
            const tData = await tRes.json();
            allTemples = tData.names;
            updateTempleSelect();
            
            const sRes = await fetch('/get_sects');
            const sData = await sRes.json();
            const sSelect = document.getElementById('sect-select');
            sData.sects.forEach(sect => {
                const opt = document.createElement('option');
                opt.value = sect; opt.text = sect;
                sSelect.appendChild(opt);
            });
        } catch (e) { console.error(e); }
    };

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.fav-tab').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.includes(tab === 'all' ? 'すべて' : 'お気に入り'));
        });
        updateTempleSelect();
    }

    function updateTempleSelect() {
        const tSelect = document.getElementById('temple-select');
        tSelect.innerHTML = '<option value="">寺院を選択...</option>';
        const displayTemples = currentTab === 'favorites' ? allTemples.filter(n => favorites.includes(n)) : allTemples;
        displayTemples.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.text = favorites.includes(name) ? `⭐ ${name}` : name;
            tSelect.appendChild(opt);
        });
    }

    async function toggleFavorite(name, event) {
        event.stopPropagation();
        event.preventDefault();
        
        try {
            const res = await fetch('/api/favorites/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ temple_name: name })
            });
            
            const data = await res.json();
            
            if (data.status === 'success') {
                // お気に入りリストを更新
                if (data.action === 'added') {
                    favorites.push(name);
                } else {
                    const index = favorites.indexOf(name);
                    if (index > -1) favorites.splice(index, 1);
                }
                
                updateTempleSelect();
                event.target.textContent = favorites.includes(name) ? '⭐' : '☆';
            } else {
                alert('お気に入りの更新に失敗しました');
            }
        } catch (e) {
            console.error('お気に入り更新エラー:', e);
            alert('お気に入りの更新に失敗しました');
        }
    }

    function hideMenu() {
        controlArea.classList.add('minimized');
        showMenuBtn.classList.add('visible');
        document.body.style.paddingBottom = "80px";
    }
    function showMenu() {
        controlArea.classList.remove('minimized');
        showMenuBtn.classList.remove('visible');
        document.body.style.paddingBottom = "400px"; 
    }

    function copyToClipboard(text) {
        if(window.event) window.event.stopPropagation();
        navigator.clipboard.writeText(text);
    }

    function clearAllChat() {
        if (!confirm('会話履歴をクリアしますか？')) return;
        chatWindow.innerHTML = '<div class="message ai-message"><p>👋 <strong>ようこそ！</strong><br>寺院名を選択して詳細情報を確認できます。</p></div>';
        currentTempleName = ""; quickQaArea.style.display = "none";
    }

    function onTempleSelect() {
        const select = document.getElementById('temple-select');
        const name = select.value;
        if (!name) return;
        
        // ユーザーメッセージを先に表示        
        currentTempleName = name; 
        quickQaArea.style.display = "flex";
        select.value = ""; 
        hideMenu(); 
        
        // サーバーにリクエスト
        sendChatRequest(name, 'summary', false);
    }

    async function onSectSelect() {
        const select = document.getElementById('sect-select');
        const sectName = select.value;
        if (!sectName) return;
        select.value = ""; currentTempleName = ""; quickQaArea.style.display = "none";
        hideMenu(); 
        addMessage(`📿 【${sectName}】寺院一覧`, 'user');
        
        const loadingId = addMessage('照会中...', 'ai', true);
        
        try {
            const res = await fetch('/search_by_sect', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sect: sectName })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();
            
            if (data.results.length === 0) { 
                addMessage("該当する寺院がありません", 'ai'); 
                return; 
            }
            
            let listHtml = `<p><b>${sectName}</b> の寺院（${data.results.length}件）</p>`;
            data.results.forEach(temple => {
                const isFav = favorites.includes(temple.name);
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(temple.address)}`;
                listHtml += `<div class="temple-card" onclick="tapTempleList('${temple.name.replace(/'/g, "\\'")}')">
                    <button class="favorite-btn" onclick="toggleFavorite('${temple.name.replace(/'/g, "\\'")}', event)">${isFav ? '⭐' : '☆'}</button>
                    <div class="card-name">${temple.name}</div>
                    <div class="card-addr">${temple.address}
                        <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation()">📍地図</a>
                        <button class="copy-btn" onclick="copyToClipboard('${temple.address.replace(/'/g, "\\'")}')">📋</button>
                    </div></div>`;
            });
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-message'; 
            msgDiv.innerHTML = listHtml;
            chatWindow.appendChild(msgDiv);
            msgDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) { 
            document.getElementById(loadingId).remove();
            addMessage("❌ エラーが発生しました", 'ai'); 
        }
    }

    function tapTempleList(name) { 
        addMessage(name, 'user');
        currentTempleName = name; 
        quickQaArea.style.display = "flex";
        hideMenu(); 
        sendChatRequest(name, 'summary', false);
    }

    function askQuick(question) {
        if (!currentTempleName) { alert("⚠️ まず寺院を選択してください"); return; }
        hideMenu(); 
        sendChatRequest(`${currentTempleName}の${question}`, 'qa', true);
    }

    function sendFreeChat() {
        const input = document.getElementById('free-input');
        const text = input.value.trim();
        if (!text) return;
        let sendText = text;
        if (currentTempleName && !text.includes(currentTempleName)) sendText = `${currentTempleName}の${text}`;
        input.value = ''; 
        hideMenu(); 
        sendChatRequest(sendText, 'qa', true);
    }

    async function sendChatRequest(text, mode, showUserMessage = true) {
        if (showUserMessage) {
            addMessage(text, 'user');
        }
        
        const loadingId = addMessage('照会中...', 'ai', true);
        window.scrollTo(0, document.body.scrollHeight);
        
        try {
            const res = await fetch('/ask', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, mode: mode })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();
            const aiMsgId = addMessage(data.answer, 'ai');
            setTimeout(() => { 
                document.getElementById(aiMsgId).scrollIntoView({ behavior: 'smooth', block: 'start' }); 
            }, 100);
        } catch (e) {
            document.getElementById(loadingId).remove();
            addMessage("❌ システムエラーが発生しました", 'ai');
        }
    }

    function addMessage(text, sender, isLoading = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;
        div.id = `msg-${Date.now()}-${Math.random()}`;
        
        // ★ 修正: HTMLタグが含まれている場合はそのまま、そうでない場合のみ改行を<br>に変換
        if (text.includes('<div') || text.includes('<button')) {
            div.innerHTML = text;  // HTMLをそのまま挿入
        } else {
            div.innerHTML = text.replace(/\n/g, '<br>');  // プレーンテキストの改行を<br>に変換
        }
        
        chatWindow.appendChild(div);
        
        // お気に入りボタンの状態を更新
        if (sender === 'ai') {
            setTimeout(() => {
                const detailButtons = div.querySelectorAll('.favorite-btn-detail');
                detailButtons.forEach(btn => {
                    const templeName = btn.dataset.temple;
                    if (favorites.includes(templeName)) {
                        btn.textContent = '⭐';
                        btn.style.borderColor = '#ffc107';
                    }
                });
            }, 100);
        }
        
        setTimeout(() => { window.scrollTo(0, document.body.scrollHeight); }, 100);
        return div.id;
    }    

function toggleAccordionFront(headerId, contentId) {
    const header = document.getElementById(headerId);
    const content = document.getElementById(contentId);
    
    if (!header || !content) {
        // IDが見つからない場合は従来の方法で探す
        const allHeaders = document.querySelectorAll('.accordion-header');
        allHeaders.forEach(h => {
            if (h.nextElementSibling && h.nextElementSibling.id === contentId) {
                header = h;
                content = h.nextElementSibling;
            }
        });
    }
    
    if (!header || !content) return;
    
    const isActive = header.classList.contains('active');
    
    if (isActive) {
        // 閉じる
        const currentHeight = content.scrollHeight;
        content.style.maxHeight = currentHeight + 'px';
        
        // ブラウザに高さを認識させるための遅延
        requestAnimationFrame(() => {
            content.style.maxHeight = '0';
            header.classList.remove('active');
            content.classList.remove('active');
        });
    } else {
        // 開く
        header.classList.add('active');
        content.classList.add('active');
        
        // ★ 重要: scrollHeightを取得して設定
        const scrollHeight = content.scrollHeight;
        content.style.maxHeight = scrollHeight + 'px';
        
        // アニメーション完了後に auto に設定
        setTimeout(() => {
            if (content.classList.contains('active')) {
                content.style.maxHeight = 'none';
            }
        }, 400);
    }
}

// 音声入力機能
let recognition = null;

function startVoiceInput() {
    // ブラウザが音声認識をサポートしているか確認
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        alert('このブラウザは音声入力に対応していません。Chrome、Edge、Safariをご利用ください。');
        return;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'ja-JP';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    const voiceBtn = document.getElementById('voiceBtn');
    const freeInput = document.getElementById('free-input');
    
    // 録音開始
    voiceBtn.textContent = '🔴';
    voiceBtn.style.transform = 'scale(1.1)';
    freeInput.placeholder = '🎤 音声入力中...';
    
    recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        freeInput.value = transcript;
        
        voiceBtn.textContent = '🎤';
        voiceBtn.style.transform = 'scale(1)';
        freeInput.placeholder = '確認事項を入力';
    };
    
    recognition.onerror = function(event) {
        console.error('音声認識エラー:', event.error);
        voiceBtn.textContent = '🎤';
        voiceBtn.style.transform = 'scale(1)';
        freeInput.placeholder = '確認事項を入力';
        
        if (event.error === 'no-speech') {
            alert('音声が認識できませんでした。もう一度お試しください。');
        } else if (event.error === 'not-allowed') {
            alert('マイクへのアクセスが許可されていません。ブラウザの設定を確認してください。');
        } else {
            alert('音声認識エラーが発生しました: ' + event.error);
        }
    };
    
    recognition.onend = function() {
        voiceBtn.textContent = '🎤';
        voiceBtn.style.transform = 'scale(1)';
        freeInput.placeholder = '確認事項を入力';
    };
    
    recognition.start();
}

// 音声入力テキストに最も近い寺院名を検索
function findClosestTemple(voiceText) {
    const normalized = voiceText.replace(/寺|じ$/g, '');
    
    // 完全一致を優先
    let match = allTemples.find(name => name === voiceText);
    if (match) return match;
    
    // 部分一致（前方一致）
    match = allTemples.find(name => name.startsWith(normalized));
    if (match) return match;
    
    // 部分一致（含む）
    match = allTemples.find(name => name.includes(normalized));
    if (match) return match;
    
    // ひらがな変換して検索
    const kanaText = voiceText.replace(/じ$/g, '寺');
    match = allTemples.find(name => name.includes(kanaText));
    
    return match || null;
}

// 寺院詳細画面のお気に入りボタン用
async function toggleFavoriteDetail(name) {
    try {
        const res = await fetch('/api/favorites/toggle', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ temple_name: name })
        });
        
        const data = await res.json();
        
        if (data.status === 'success') {
            // お気に入りリストを更新
            if (data.action === 'added') {
                favorites.push(name);
            } else {
                const index = favorites.indexOf(name);
                if (index > -1) favorites.splice(index, 1);
            }
            
            // ボタンの表示を更新
            updateFavoriteButtons(name);
            updateTempleSelect();
        } else {
            alert('お気に入りの更新に失敗しました');
        }
    } catch (e) {
        console.error('お気に入り更新エラー:', e);
        alert('お気に入りの更新に失敗しました');
    }
}

// すべてのお気に入りボタンの表示を更新
function updateFavoriteButtons(templeName) {
    const isFavorite = favorites.includes(templeName);
    
    // 寺院詳細のボタン
    const detailButtons = document.querySelectorAll('.favorite-btn-detail');
    detailButtons.forEach(btn => {
        if (btn.dataset.temple === templeName) {
            btn.textContent = isFavorite ? '⭐' : '☆';
            btn.style.borderColor = isFavorite ? '#ffc107' : '#ddd';
        }
    });
    
    // 宗派別リストのボタン
    const listButtons = document.querySelectorAll('.favorite-btn');
    listButtons.forEach(btn => {
        const card = btn.closest('.temple-card');
        if (card && card.textContent.includes(templeName)) {
            btn.textContent = isFavorite ? '⭐' : '☆';
        }
    });
}

</script>
</body>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js")
    .then(() => console.log("ServiceWorker registered"))
    .catch(err => console.error("SW error", err));
}
</script>
</html>
