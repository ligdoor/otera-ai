<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺院情報管理システム</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#000000">
</head>
<body>
<header>
    <div class="header-content">
        <button class="header-btn" onclick="toggleDarkMode()">🌙</button>
        <h1>🏯 寺院情報データベース</h1>
        <a href="/admin" class="header-btn">⚙️</a>
    </div>
</header>

<button class="clear-chat-btn" onclick="clearAllChat()">🗑️ クリア</button>

<div id="chat-window" onclick="hideMenu()">
    <div class="message ai-message">
        <p>👋 <strong>ようこそ！</strong><br>寺院名を選択して詳細情報を確認できます。</p>
    </div>
</div>

<button id="show-menu-btn" onclick="showMenu()">🔍</button>

<div class="control-area" id="control-area">
    <div class="close-handle" onclick="hideMenu()"></div>
    <div class="control-group">
        <div class="favorites-toggle">
            <button class="fav-tab active" onclick="switchTab('all')">🏯 すべて</button>
            <button class="fav-tab" onclick="switchTab('favorites')">⭐ お気に入り</button>
        </div>

        <div>
            <span class="label-text"><span>🔍</span>寺院検索（詳細表示）</span>
            <div class="custom-select-wrapper">
                <select id="temple-select" onchange="onTempleSelect()">
                    <option value="">寺院を選択...</option>
                </select>
            </div>
        </div>

        <div>
            <span class="label-text"><span>📿</span>宗派別リスト</span>
            <div class="custom-select-wrapper">
                <select id="sect-select" onchange="onSectSelect()">
                    <option value="">宗派を選択...</option>
                </select>
            </div>
        </div>
        
        <div>
            <span class="label-text"><span>💬</span>項目確認</span>
            <div id="quick-qa-area">
                <div class="qa-chip" onclick="askQuick('納棺の注意点は？')">⚰️ 納棺仕様</div>
                <div class="qa-chip" onclick="askQuick('書き物の指定は？')">🖊️ 書き物</div>
                <div class="qa-chip" onclick="askQuick('式の流れは？')">📜 式の流れ</div>
                <div class="qa-chip" onclick="askQuick('搬送時の持ち物は？')">🚗 搬送持ち物</div>
                <div class="qa-chip" onclick="askQuick('注意事項は？')">⚠️ 注意事項</div>
            </div>
            <div class="text-input-wrapper">
                <input type="text" id="free-input" placeholder="確認事項を入力" onkeypress="if(event.key === 'Enter') sendFreeChat()">
                <button class="send-btn" onclick="sendFreeChat()">📤 確認</button>
            </div>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const controlArea = document.getElementById('control-area');
    const showMenuBtn = document.getElementById('show-menu-btn');
    const quickQaArea = document.getElementById('quick-qa-area');
    
    let currentTempleName = "";
    let favorites = JSON.parse(localStorage.getItem('temple_favorites') || '[]');
    let currentTab = 'all';
    let allTemples = [];

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
    }
    if(localStorage.getItem('theme') === 'dark') document.body.classList.add('dark-mode');

    window.onload = async function() {
        try {
            const tRes = await fetch('/get_temple_names');
            const tData = await tRes.json();
            allTemples = tData.names;
            updateTempleSelect();
            
            const sRes = await fetch('/get_sects');
            const sData = await sRes.json();
            const sSelect = document.getElementById('sect-select');
            sData.sects.forEach(sect => {
                const opt = document.createElement('option');
                opt.value = sect; opt.text = sect;
                sSelect.appendChild(opt);
            });
        } catch (e) { console.error(e); }
    };

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.fav-tab').forEach(btn => {
            btn.classList.toggle('active', btn.textContent.includes(tab === 'all' ? 'すべて' : 'お気に入り'));
        });
        updateTempleSelect();
    }

    function updateTempleSelect() {
        const tSelect = document.getElementById('temple-select');
        tSelect.innerHTML = '<option value="">寺院を選択...</option>';
        const displayTemples = currentTab === 'favorites' ? allTemples.filter(n => favorites.includes(n)) : allTemples;
        displayTemples.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.text = favorites.includes(name) ? `⭐ ${name}` : name;
            tSelect.appendChild(opt);
        });
    }

    function toggleFavorite(name, event) {
        event.stopPropagation();
        event.preventDefault();
        const index = favorites.indexOf(name);
        if (index > -1) favorites.splice(index, 1);
        else favorites.push(name);
        localStorage.setItem('temple_favorites', JSON.stringify(favorites));
        updateTempleSelect();
        
        // ボタンの表示を即座に更新
        event.target.textContent = favorites.includes(name) ? '⭐' : '☆';
    }

    function hideMenu() {
        controlArea.classList.add('minimized');
        showMenuBtn.classList.add('visible');
        document.body.style.paddingBottom = "80px";
    }
    function showMenu() {
        controlArea.classList.remove('minimized');
        showMenuBtn.classList.remove('visible');
        document.body.style.paddingBottom = "400px"; 
    }

    function copyToClipboard(text) {
        if(window.event) window.event.stopPropagation();
        navigator.clipboard.writeText(text);
    }

    function clearAllChat() {
        if (!confirm('会話履歴をクリアしますか？')) return;
        chatWindow.innerHTML = '<div class="message ai-message"><p>👋 <strong>ようこそ！</strong><br>寺院名を選択して詳細情報を確認できます。</p></div>';
        currentTempleName = ""; quickQaArea.style.display = "none";
    }

    function onTempleSelect() {
        const select = document.getElementById('temple-select');
        const name = select.value;
        if (!name) return;
        
        // ユーザーメッセージを先に表示
        addMessage(name, 'user');
        
        currentTempleName = name; 
        quickQaArea.style.display = "flex";
        select.value = ""; 
        hideMenu(); 
        
        // サーバーにリクエスト
        sendChatRequest(name, 'summary', false);
    }

    async function onSectSelect() {
        const select = document.getElementById('sect-select');
        const sectName = select.value;
        if (!sectName) return;
        select.value = ""; currentTempleName = ""; quickQaArea.style.display = "none";
        hideMenu(); 
        addMessage(`📿 【${sectName}】寺院一覧`, 'user');
        
        const loadingId = addMessage('照会中...', 'ai', true);
        
        try {
            const res = await fetch('/search_by_sect', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sect: sectName })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();
            
            if (data.results.length === 0) { 
                addMessage("該当する寺院がありません", 'ai'); 
                return; 
            }
            
            let listHtml = `<p><b>${sectName}</b> の寺院（${data.results.length}件）</p>`;
            data.results.forEach(temple => {
                const isFav = favorites.includes(temple.name);
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(temple.address)}`;
                listHtml += `<div class="temple-card" onclick="tapTempleList('${temple.name.replace(/'/g, "\\'")}')">
                    <button class="favorite-btn" onclick="toggleFavorite('${temple.name.replace(/'/g, "\\'")}', event)">${isFav ? '⭐' : '☆'}</button>
                    <div class="card-name">${temple.name}</div>
                    <div class="card-addr">${temple.address}
                        <a href="${mapUrl}" target="_blank" onclick="event.stopPropagation()">📍地図</a>
                        <button class="copy-btn" onclick="copyToClipboard('${temple.address.replace(/'/g, "\\'")}')">📋</button>
                    </div></div>`;
            });
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai-message'; 
            msgDiv.innerHTML = listHtml;
            chatWindow.appendChild(msgDiv);
            msgDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        } catch (e) { 
            document.getElementById(loadingId).remove();
            addMessage("❌ エラーが発生しました", 'ai'); 
        }
    }

    function tapTempleList(name) { 
        addMessage(name, 'user');
        currentTempleName = name; 
        quickQaArea.style.display = "flex";
        hideMenu(); 
        sendChatRequest(name, 'summary', false);
    }

    function askQuick(question) {
        if (!currentTempleName) { alert("⚠️ まず寺院を選択してください"); return; }
        hideMenu(); 
        sendChatRequest(`${currentTempleName}の${question}`, 'qa', true);
    }

    function sendFreeChat() {
        const input = document.getElementById('free-input');
        const text = input.value.trim();
        if (!text) return;
        let sendText = text;
        if (currentTempleName && !text.includes(currentTempleName)) sendText = `${currentTempleName}の${text}`;
        input.value = ''; 
        hideMenu(); 
        sendChatRequest(sendText, 'qa', true);
    }

    async function sendChatRequest(text, mode, showUserMessage = true) {
        if (showUserMessage) {
            addMessage(text, 'user');
        }
        
        const loadingId = addMessage('照会中...', 'ai', true);
        window.scrollTo(0, document.body.scrollHeight);
        
        try {
            const res = await fetch('/ask', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text, mode: mode })
            });
            const data = await res.json();
            document.getElementById(loadingId).remove();
            const aiMsgId = addMessage(data.answer, 'ai');
            setTimeout(() => { 
                document.getElementById(aiMsgId).scrollIntoView({ behavior: 'smooth', block: 'start' }); 
            }, 100);
        } catch (e) {
            document.getElementById(loadingId).remove();
            addMessage("❌ システムエラーが発生しました", 'ai');
        }
    }

    function addMessage(text, sender, isLoading = false) {
        const div = document.createElement('div');
        div.className = `message ${sender}-message`;
        div.id = `msg-${Date.now()}-${Math.random()}`;
        const p = document.createElement('p');
        p.innerHTML = text.replace(/\n/g, '<br>');
        div.appendChild(p);
        chatWindow.appendChild(div);
        setTimeout(() => { window.scrollTo(0, document.body.scrollHeight); }, 100);
        return div.id;
    }
</script>
</body>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/service-worker.js")
    .then(() => console.log("ServiceWorker registered"))
    .catch(err => console.error("SW error", err));
}
</script>
</html>
