<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺院データ管理画面</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; background-color: #f4f6f8; color: #333; }
        
        /* ヘッダーエリア */
        .header-area { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 2px solid #1a237e; padding-bottom: 10px; margin-bottom: 20px;
        }
        h1 { color: #1a237e; margin: 0; font-size: 1.5rem; }
        
        .header-btns { display: flex; gap: 10px; }
        .back-link { 
            text-decoration: none; color: #1a237e; font-weight: bold; 
            border: 1px solid #1a237e; padding: 8px 12px; border-radius: 4px; background: white;
        }
        /* 更新ボタン */
        .reload-btn {
            background: #f57f17; color: white; border: none; padding: 8px 15px; 
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .reload-btn:hover { background: #f9a825; }
        
        /* 操作バー */
        .action-bar { margin-bottom: 20px; }
        .add-btn { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold;}
        
        /* リスト */
        .temple-list { margin-top: 10px; }
        .temple-item { 
            background: white; padding: 15px; margin-bottom: 10px; border-radius: 8px; 
            border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;
        }
        .temple-name { font-weight: bold; font-size: 1.1em; }
        
        .item-btns { display: flex; gap: 10px; }
        .edit-btn { background: #1a237e; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
        .del-btn { background: #c62828; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }

        /* モーダル */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px;
            max-height: 90vh; overflow-y: auto;
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        textarea { height: 60px; }

        .btn-group { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .save-btn { background: #2e7d32; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .cancel-btn { background: #757575; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="header-area">
    <h1>管理画面</h1>
    <div class="header-btns">
        <button class="reload-btn" onclick="reloadData()">🔄 データを最新にする</button>
        <a href="/" class="back-link">← アプリへ</a>
    </div>
</div>

<div class="action-bar">
    <button class="add-btn" onclick="openAddModal()">＋ 新規寺院を追加</button>
</div>

<div id="temple-list" class="temple-list">
    <!-- リスト表示 -->
</div>

<!-- 編集・追加用モーダル -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <h2 id="modal-title">編集</h2>
        <form id="edit-form">
            <input type="hidden" id="mode" value="edit">
            <input type="hidden" id="original-name">
            
            <!-- 項目一覧 -->
            <div class="form-group"><label>寺院名 (name) ※必須</label><input type="text" id="name" required></div>
            <div class="form-group"><label>宗派 (sect)</label><input type="text" id="sect"></div>
            <div class="form-group"><label>住所 (address)</label><input type="text" id="address"></div>
            <div class="form-group"><label>搬送持ち物 (transport)</label><textarea id="transport"></textarea></div>
            <div class="form-group"><label>納棺仕様 (nokanshiyo)</label><textarea id="nokanshiyo"></textarea></div>
            <div class="form-group"><label>書き物 (kakimono)</label><textarea id="kakimono"></textarea></div>
            <div class="form-group"><label>式の流れ (flow)</label><textarea id="flow"></textarea></div>
            <div class="form-group"><label>注意事項 (caution)</label><textarea id="caution"></textarea></div>
            
            <div class="btn-group">
                <button type="button" class="cancel-btn" onclick="closeModal()">キャンセル</button>
                <button type="submit" class="save-btn">保存する</button>
            </div>
        </form>
    </div>
</div>

<script>
    const FIELDS = ['name', 'sect', 'address', 'transport', 'nokanshiyo', 'kakimono', 'flow', 'caution'];

    // 一覧取得
    function loadList() {
        fetch('/get_all_data')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('temple-list');
                list.innerHTML = ''; 
                const sortedKeys = Object.keys(data).sort();
                
                sortedKeys.forEach(key => {
                    const t = data[key];
                    const div = document.createElement('div');
                    div.className = 'temple-item';
                    const sectDisplay = t.sect ? ` <span style="font-weight:normal; font-size:0.9em; color:#666;">(${t.sect})</span>` : '';
                    div.innerHTML = `
                        <span class="temple-name">${t.name}${sectDisplay}</span>
                        <div class="item-btns">
                            <button class="edit-btn" onclick='openEditModal(${JSON.stringify(t)})'>編集</button>
                            <button class="del-btn" onclick="deleteTemple('${t.name}')">削除</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            });
    }
    loadList();

    // ★データ更新処理
    async function reloadData() {
        if(!confirm("スプレッドシートから最新データを読み込みますか？")) return;
        
        const btn = document.querySelector('.reload-btn');
        const originalText = btn.innerText;
        btn.innerText = "更新中...";
        btn.disabled = true;

        const res = await fetch('/reload_data', { method: 'POST' });
        
        if(res.ok) {
            alert("更新しました！");
            loadList(); // リストも再取得
        } else {
            alert("更新に失敗しました");
        }
        btn.innerText = originalText;
        btn.disabled = false;
    }

    const modal = document.getElementById('edit-modal');

    function openAddModal() {
        document.getElementById('modal-title').innerText = "新規寺院の追加";
        document.getElementById('mode').value = "add";
        document.getElementById('original-name').value = "";
        FIELDS.forEach(f => document.getElementById(f).value = "");
        modal.style.display = 'flex';
    }

    function openEditModal(temple) {
        document.getElementById('modal-title').innerText = `${temple.name} の編集`;
        document.getElementById('mode').value = "edit";
        document.getElementById('original-name').value = temple.name;
        FIELDS.forEach(f => document.getElementById(f).value = temple[f] || '');
        modal.style.display = 'flex';
    }

    function closeModal() {
        modal.style.display = 'none';
    }

    document.getElementById('edit-form').onsubmit = async function(e) {
        e.preventDefault();
        const mode = document.getElementById('mode').value;
        const formData = {};
        FIELDS.forEach(f => formData[f] = document.getElementById(f).value);
        const originalName = document.getElementById('original-name').value;

        if(!confirm("保存してよろしいですか？")) return;

        let url = mode === 'add' ? '/add_temple' : '/update_temple';
        
        const res = await fetch(url, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ original_name: originalName, data: formData })
        });

        if(res.ok) {
            alert("保存しました！");
            closeModal();
            // 保存後は自動でメモリも更新されるのでリロード不要だが、念のためリスト更新
            loadList();
        } else {
            const err = await res.json();
            alert("エラー: " + (err.message || "不明なエラー"));
        }
    };

    async function deleteTemple(name) {
        if(!confirm(`本当に「${name}」を削除してもよろしいですか？`)) return;
        
        const res = await fetch('/delete_temple', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name: name })
        });

        if(res.ok) {
            alert("削除しました。");
            loadList();
        } else {
            alert("削除に失敗しました。");
        }
    }
</script>
</body>
</html>
