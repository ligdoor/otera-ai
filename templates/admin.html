<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>寺院データ管理画面</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
</head>
<body>

<header>
    <div class="header-content">
        <div class="header-title">
            <h1>管理画面</h1>
            <span class="user-badge">{{ user_name }}さん</span>
        </div>
        <div class="header-btns">
            <button class="header-btn" onclick="openPassModal()">
                <span class="icon">🔑</span>
                <span>パスワード変更</span>
            </button>
            <a href="/admin/users" class="header-btn" id="user-management-link" style="display:none;">
                <span class="icon">👥</span>
                <span>ユーザー管理</span>
            </a>
            <a href="/admin/fields" class="header-btn">
                <span class="icon">⚙️</span>
                <span>項目設定</span>
            </a>
            <button class="header-btn warning" onclick="reloadData()">
                <span class="icon">🔄</span>
                <span>データ更新</span>
            </button>
            <a href="/" class="header-btn">
                <span class="icon">🏠</span>
                <span>アプリへ</span>
            </a>
            <a href="/logout" class="header-btn danger">
                <span class="icon">🚪</span>
                <span>ログアウト</span>
            </a>
        </div>
    </div>
</header>

<main>
    <!-- CSV機能とアクセス統計 -->
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
        <button class="btn btn-edit" onclick="exportCSV()" style="flex:1; min-width:200px;">
            <span class="icon">📥</span>
            <span>CSVエクスポート</span>
        </button>
        <label class="btn btn-edit" id="csv-import-btn" style="flex:1; min-width:200px; cursor:pointer; display:none;">
            <span class="icon">📤</span>
            <span>CSVインポート</span>
            <input type="file" id="csv-file" accept=".csv" style="display:none" onchange="importCSV()">
        </label>
        <button class="btn btn-preview" onclick="showAccessStats()" style="flex:1; min-width:200px;">
            <span class="icon">📊</span>
            <span>アクセス統計</span>
        </button>
    </div>

    <button class="add-btn" id="add-temple-btn" onclick="openAddModal()" style="display:none;">
        <span class="icon" style="font-size:1.3em">➕</span>
        新規寺院を追加
    </button>

    <div id="temple-list" class="temple-list"></div>

    <div class="log-area">
        <h3>📋 最近の操作ログ</h3>
        <div class="log-container">
            <table class="log-table">
                <thead>
                    <tr>
                        <th>日時</th>
                        <th>担当</th>
                        <th>操作</th>
                        <th>詳細</th>
                    </tr>
                </thead>
                <tbody id="log-list"></tbody>
            </table>
        </div>
    </div>
</main>

<!-- ローディングオーバーレイ -->
<div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
        <div class="spinner"></div>
        <p style="margin:0; font-size:1.1rem; font-weight:600; color:#1a237e;">
            データを読み込み中...
        </p>
    </div>
</div>

<!-- 編集モーダル -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modal-title">編集</h2>
            <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
        </div>
        <form id="edit-form">
            <div class="modal-body">
                <input type="hidden" id="mode" value="edit">
                <input type="hidden" id="original-name">
                <div id="dynamic-form-fields"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('edit-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span class="icon">💾</span>
                    保存する
                </button>
            </div>
        </form>
    </div>
</div>

<!-- プレビューモーダル -->
<div id="preview-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>👁️ プレビュー</h2>
            <button class="modal-close" onclick="closeModal('preview-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="preview-content" class="preview-content"></div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal('preview-modal')" style="flex:1">
                閉じる
            </button>
        </div>
    </div>
</div>

<!-- パスワード変更モーダル -->
<div id="pass-modal" class="modal">
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <h2>🔐 パスワード変更</h2>
            <button class="modal-close" onclick="closeModal('pass-modal')">&times;</button>
        </div>
        <form id="pass-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">現在のパスワード</label>
                    <input type="password" id="current-pass" class="form-input" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード</label>
                    <input type="password" id="new-pass" class="form-input" required autocomplete="new-password">
                    <small style="color:#666; font-size:0.85em;">
                        8文字以上、英字と数字を含む
                    </small>
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード（確認）</label>
                    <input type="password" id="new-pass-confirm" class="form-input" required autocomplete="new-password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('pass-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span class="icon">🔒</span>
                    変更する
                </button>
            </div>
        </form>
    </div>
</div>

<!-- アクセス統計モーダル -->
<div id="stats-modal" class="modal">
    <div class="modal-content" style="max-width:600px;">
        <div class="modal-header">
            <h2>📊 アクセス統計</h2>
            <button class="modal-close" onclick="closeModal('stats-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <h3 style="margin-top:0;">よく閲覧される寺院 TOP10</h3>
            <div id="stats-content">読み込み中...</div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal('stats-modal')" style="flex:1">
                閉じる
            </button>
        </div>
    </div>
</div>

<!-- コメントモーダル -->
<div id="comment-modal" class="modal">
    <div class="modal-content" style="max-width:700px;">
        <div class="modal-header">
            <h2 id="comment-modal-title">💬 スタッフメモ</h2>
            <button class="modal-close" onclick="closeModal('comment-modal')">&times;</button>
        </div>
        <div class="modal-body">
            <div id="comments-list" style="max-height:300px; overflow-y:auto; margin-bottom:20px;">
                <!-- コメント一覧 -->
            </div>
            <div class="form-group">
                <label class="form-label">新しいメモを追加</label>
                <textarea id="new-comment" class="form-textarea" placeholder="駐車場の位置、注意事項など..." rows="3"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-cancel" onclick="closeModal('comment-modal')">
                閉じる
            </button>
            <button class="btn btn-save" onclick="addComment()">
                <span class="icon">💬</span>
                メモを追加
            </button>
        </div>
    </div>
</div>

<script>
    let fieldConfig = [];
    let templeData = {};

    // ローディング表示制御
    function showLoading() {
        document.getElementById('loading-overlay').classList.add('show');
    }
    function hideLoading() {
        document.getElementById('loading-overlay').classList.remove('show');
    }
    
    // ★ 新規追加: ボタン無効化（連打防止） ★
    function disableButtons() {
        const buttons = document.querySelectorAll('.header-btn, .add-btn, .btn');
        buttons.forEach(btn => {
            btn.disabled = true;
            btn.style.opacity = '0.5';
            btn.style.cursor = 'not-allowed';
        });
    }
    
    function enableButtons() {
        const buttons = document.querySelectorAll('.header-btn, .add-btn, .btn');
        buttons.forEach(btn => {
            btn.disabled = false;
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
        });
    }

    async function init() {
        // ★ 改善1: 画面は表示されているが、ボタンを無効化（連打防止） ★
        disableButtons();
        showLoading();
        
        try {
            // 項目設定を取得
            const res = await fetch('/get_fields');
            fieldConfig = await res.json();
            
            // ユーザー権限を取得してUIを制御
            try {
                const userRes = await fetch('/get_current_user');
                const userData = await userRes.json();
                const userRole = userData.role;
                
                // 管理者のみユーザー管理リンクを表示
                if (userRole === 'admin') {
                    document.getElementById('user-management-link').style.display = 'flex';
                }
                
                // 管理者・編集者のみ編集機能を表示
                if (userRole === 'admin' || userRole === 'editor') {
                    document.getElementById('add-temple-btn').style.display = 'flex';
                    document.getElementById('csv-import-btn').style.display = 'flex';
                }
            } catch (e) {
                console.log('権限チェックエラー:', e);
            }
            
            // ★ 改善2: データとログを並列で取得（高速化） ★
            await Promise.all([loadList(), loadLogs()]);
            
        } catch (e) {
            console.error('初期化エラー:', e);
            alert('❌ データの読み込みに失敗しました。ページをリロードしてください。');
        } finally {
            hideLoading();
            enableButtons(); // ★ ボタンを有効化 ★
        }
    }
    
    // ★ 改善3: ページ読み込み完了後すぐに初期化 ★
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }

    async function loadList() {
        const list = document.getElementById('temple-list');
        list.innerHTML = '<div style="text-align:center; padding:20px; color:#999;">読み込み中...</div>';
        
        try {
            // ★ ユーザー権限を取得 ★
            const userRes = await fetch('/get_current_user');
            const userData = await userRes.json();
            const userRole = userData.role;
            const canEdit = (userRole === 'admin' || userRole === 'editor');
        
            const res = await fetch('/get_all_data');
           if (!res.ok) throw new Error('データ取得失敗');
        
            templeData = await res.json();
            list.innerHTML = ''; 
        
            const sortedKeys = Object.keys(templeData).sort();
        
            if (sortedKeys.length === 0) {
                list.innerHTML = '<div style="text-align:center; padding:40px; color:#999;">登録されている寺院がありません</div>';
               return;
           }
        
    sortedKeys.forEach(key => {
       const t = templeData[key];
        const div = document.createElement('div');
        div.className = 'temple-item';
    
        const sectDisplay = t.sect ? `<span class="temple-sect">${t.sect}</span>` : '';
    
        // ★ データをエスケープして保存
        div.dataset.temple = JSON.stringify(t);
        const nameEscaped = t.name.replace(/'/g, "\\'");
    
        // ★ 権限に応じてボタンを表示/非表示 ★
        const editButtons = canEdit ? `
            <button class="btn btn-edit" onclick="openEditModalFromData(this)">
                <span class="icon">✏️</span>
                <span>編集</span>
            </button>
            <button class="btn btn-delete" onclick="deleteTemple('${nameEscaped}')">
                <span class="icon">🗑️</span>
            </button>
        ` : '';
    
        div.innerHTML = `
            <div class="temple-header">
                <div class="temple-info">
                    <div class="temple-name">${t.name}</div>
                    ${sectDisplay}
                </div>
                <div class="temple-actions">
                    <button class="btn btn-preview" onclick="openCommentModal('${nameEscaped}')">
                        <span class="icon">💬</span>
                        <span>メモ</span>
                    </button>
                    <button class="btn btn-preview" onclick="openPreviewModalFromData(this)">
                        <span class="icon">👁️</span>
                        <span>プレビュー</span>
                    </button>
                    ${editButtons}
                </div>
            </div>
        `;
        list.appendChild(div);
    });
    } catch (e) {
        console.error('データ読み込みエラー:', e);
        list.innerHTML = `
            <div style="text-align:center; padding:40px;">
                <p style="color:#d32f2f; font-size:1.1rem; margin-bottom:15px;">❌ データの読み込みに失敗しました</p>
                <button class="btn btn-edit" onclick="location.reload()" style="max-width:200px; margin:0 auto;">
                    <span class="icon">🔄</span>
                    <span>再読み込み</span>
                </button>
            </div>
        `;
    }
}    
    async function loadLogs() {
        try {
            const res = await fetch('/get_logs');
            const logs = await res.json();
            const tbody = document.getElementById('log-list');
            tbody.innerHTML = '';
            
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#999;">ログがありません</td></tr>';
                return;
            }
            
            logs.forEach(log => {
                const tr = document.createElement('tr');
                
                // 操作タイプに応じたバッジ
                let badgeClass = 'update';
                if (log.action === '編集') badgeClass = 'edit';
                else if (log.action === '追加') badgeClass = 'add';
                else if (log.action === '削除') badgeClass = 'delete';
                
                tr.innerHTML = `
                    <td>${log.timestamp}</td>
                    <td>${log.user}</td>
                    <td><span class="log-badge ${badgeClass}">${log.action}</span></td>
                    <td>${log.details}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error('ログ読み込みエラー:', e);
        }
    }

    async function reloadData() {
        if (!confirm("スプレッドシートから最新データを読み込みますか？")) return;
        try {
            await fetch('/reload_data', { method: 'POST' });
            alert("✅ 更新しました！");
            location.reload();
        } catch (e) {
            alert("❌ 更新に失敗しました");
        }
    }

    // パスワード変更
    function openPassModal() {
        document.getElementById('pass-modal').classList.add('show');
        document.getElementById('pass-form').reset();
    }

    document.getElementById('pass-form').onsubmit = async function(e) {
        e.preventDefault();
        const currentPass = document.getElementById('current-pass').value;
        const newPass = document.getElementById('new-pass').value;
        const confirmPass = document.getElementById('new-pass-confirm').value;

        if (newPass !== confirmPass) {
            alert("❌ 新しいパスワードが一致しません");
            return;
        }

        if (newPass.length < 8) {
            alert("❌ パスワードは8文字以上必要です");
            return;
        }

        try {
            const res = await fetch('/change_password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ current_pass: currentPass, new_pass: newPass })
            });

            const data = await res.json();
            if (res.ok) {
                alert("✅ パスワードを変更しました！");
                closeModal('pass-modal');
            } else {
                alert("❌ エラー: " + data.message);
            }
        } catch (e) {
            alert("❌ 通信エラーが発生しました");
        }
    };

// プレビューモーダル
// プレビューモーダル
function openPreviewModal(temple) {
    const content = document.getElementById('preview-content');
    
    // カテゴリ定義
    const categories = {
        basic: {
            title: '🏯 基本情報',
            fields: ['sect', 'address', 'transport'],
            defaultOpen: true
        },
        tsuya: {
            title: '🌙 通夜の流れ',
            fields: ['tsuya_narimono', 'tsuya_ippan_shoko', 'tsuya_shinzoku_shoko', 'tsuya_dokyo_length', 'tsuya_notes'],
            defaultOpen: false
        },
        sougi: {
            title: '☀️ 葬儀の流れ',
            fields: ['sougi_narimono', 'sougi_ippan_shoko', 'sougi_shinzoku_shoko', 'sougi_dokyo_length', 'sougi_notes'],
            defaultOpen: false
        },
        items: {
            title: '📝 お膳・書き物',
            fields: ['ozen_type', 'kakimono_detail', 'shonananoka_timing'],
            defaultOpen: false
        },
        other: {
            title: '⚠️ その他・特記事項',
            fields: ['nokanshiyo', 'kakimono', 'flow', 'caution', 'sonota_tokki'],
            defaultOpen: false
        }
    };
    
    let html = `<div class="preview-title">${temple.name}</div>`;
    
    let categoryIndex = 0;
    Object.keys(categories).forEach((catKey) => {
        const category = categories[catKey];
        const isOpen = category.defaultOpen;
        const activeClass = isOpen ? 'active' : '';
        
        // このカテゴリに表示する項目があるかチェック
        const fieldsToShow = [];
        category.fields.forEach(fieldKey => {
            const field = fieldConfig.find(f => f.key === fieldKey);
            if (field) {
                const value = temple[fieldKey];
                fieldsToShow.push({
                    key: fieldKey,
                    label: field.label,
                    value: value || ''
                });
            }
        });
        
        if (fieldsToShow.length === 0) return; // 項目が1つもなければスキップ
        
        const accordionId = `accordion-preview-${categoryIndex}`;
        const headerId = `header-preview-${categoryIndex}`;
        categoryIndex++;
        
        html += `
            <div class="accordion-section">
                <div class="accordion-header ${activeClass}" id="${headerId}" onclick="toggleAccordionPreview('${headerId}', '${accordionId}')">
                    <div class="accordion-title">
                        <span class="accordion-icon">▶</span>
                        <span>${category.title}</span>
                    </div>
                </div>
                <div class="accordion-content ${activeClass}" id="${accordionId}" style="${isOpen ? 'max-height: none;' : ''}">
                    <div class="accordion-body">
        `;
        
        fieldsToShow.forEach(item => {
            const displayValue = item.value && item.value.trim() !== '' ? item.value : '記載なし';
            const isEmpty = !item.value || item.value.trim() === '';
            
            // 住所の場合はGoogleマップリンクを追加
            if (item.key === 'address' && !isEmpty) {
                const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(displayValue)}`;
                const addressEscaped = displayValue.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                html += `
                    <div style="margin-bottom:6px;">
                        <div style="font-weight:600; color:#555; font-size:0.88rem; margin-bottom:2px;">${item.label}:</div>
                        <div style="font-size:0.9rem; line-height:1.5;">
                            ${displayValue}
                            <button class="copy-btn" onclick="event.stopPropagation(); copyToClipboardAdmin('${addressEscaped}')" style="margin-left:4px; padding:2px 8px; font-size:0.8rem;">📋</button>
                        </div>
                        <a href="${mapUrl}" target="_blank" style="color:#1a237e; font-weight:bold; text-decoration:underline; margin-top:4px; display:inline-block; font-size:0.85rem;">📍地図を開く</a>
                    </div>
                `;
            } else {
                // その他の項目
                const valueStyle = isEmpty ? 'color:#999; font-style:italic; font-size:0.85rem;' : 'font-size:0.9rem; line-height:1.5;';
                
                html += `
                    <div style="margin-bottom:6px;">
                        <div style="font-weight:600; color:#555; font-size:0.88rem; margin-bottom:2px;">${item.label}:</div>
                        <div style="${valueStyle}">${displayValue}</div>
                    </div>
                `;
            }
        });
        
        html += `
                    </div>
                </div>
            </div>
        `;
    });
    
    content.innerHTML = html;
    document.getElementById('preview-modal').classList.add('show');
}

// データ属性からプレビューモーダルを開く
function openPreviewModalFromData(button) {
    const templeItem = button.closest('.temple-item');
    const templeData = JSON.parse(templeItem.dataset.temple);
    openPreviewModal(templeData);
}

// データ属性から編集モーダルを開く
function openEditModalFromData(button) {
    const templeItem = button.closest('.temple-item');
    const templeData = JSON.parse(templeItem.dataset.temple);
    openEditModal(templeData);
}

// アコーディオンの開閉（プレビュー用）
function toggleAccordionPreview(headerId, contentId) {
    const header = document.getElementById(headerId);
    const content = document.getElementById(contentId);
    
    if (!header || !content) {
        console.error('要素が見つかりません:', headerId, contentId);
        return;
    }
    
    const isActive = header.classList.contains('active');
    
    if (isActive) {
        // 閉じる
        const currentHeight = content.scrollHeight;
        content.style.maxHeight = currentHeight + 'px';
        
        // ブラウザに高さを認識させるための遅延
        requestAnimationFrame(() => {
            content.style.maxHeight = '0';
            header.classList.remove('active');
            content.classList.remove('active');
        });
    } else {
        // 開く
        header.classList.add('active');
        content.classList.add('active');
        
        const scrollHeight = content.scrollHeight;
        content.style.maxHeight = scrollHeight + 'px';
        
        // アニメーション完了後に auto に設定
        setTimeout(() => {
            if (content.classList.contains('active')) {
                content.style.maxHeight = 'none';
            }
        }, 400);
    }
}
// コピー機能（管理画面用）
function copyToClipboardAdmin(text) {
    if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
            alert('📋 コピーしました: ' + text);
        }).catch(err => {
            alert('📋 コピーに失敗しました');
        });
    } else {
        // フォールバック
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('📋 コピーしました: ' + text);
    }
}

// 編集フォーム
let quillEditors = {};

function renderForm(data = {}) {
    const container = document.getElementById('dynamic-form-fields');
    container.innerHTML = ''; 
    quillEditors = {};

    const isMobile = window.innerWidth < 768;

    const toolbarDesktop = [
        ['bold', 'italic', 'underline', 'strike'],
        [{ 'color': [] }, { 'background': [] }],
        [{ 'list': 'ordered' }, { 'list': 'bullet' }],
        ['clean']
    ];

    const toolbarMobile = [
        ['bold', 'underline', 'strike'],
        [{ 'color': [] }],
        ['clean']
    ];

    fieldConfig.forEach(field => {
        const div = document.createElement('div');
        div.className = 'form-group';
        const value = data[field.key] || '';

        if (['name', 'sect', 'address'].includes(field.key)) {
            div.innerHTML = `
                <label class="form-label">${field.label}</label>
                <input type="text" id="input-${field.key}" class="form-input" value="${value}">
            `;
        } else {
            const editorId = `editor-${field.key}`;
            div.innerHTML = `
                <label class="form-label">${field.label}</label>
                <div id="${editorId}" class="quill-editor"></div>
                <input type="hidden" id="input-${field.key}">
            `;
            container.appendChild(div);

            const quill = new Quill(`#${editorId}`, {
                theme: 'snow',
                modules: {
                    toolbar: isMobile ? toolbarMobile : toolbarDesktop
                }
            });

            quill.root.innerHTML = value;
            quillEditors[field.key] = quill;
            return;
        }

        container.appendChild(div);
    });
}

    function openAddModal() {
        document.getElementById('modal-title').innerText = "➕ 新規寺院の追加";
        document.getElementById('mode').value = "add";
        document.getElementById('original-name').value = "";
        renderForm({});
        document.getElementById('edit-modal').classList.add('show');
    }

    function openEditModal(temple) {
        document.getElementById('modal-title').innerText = `✏️ ${temple.name} の編集`;
        document.getElementById('mode').value = "edit";
        document.getElementById('original-name').value = temple.name;
        renderForm(temple);
        document.getElementById('edit-modal').classList.add('show');
    }

    function closeModal(id) { 
        document.getElementById(id).classList.remove('show'); 
    }

    document.getElementById('edit-form').onsubmit = async function(e) {
        e.preventDefault();
        const mode = document.getElementById('mode').value;
        const originalName = document.getElementById('original-name').value;
        const formData = {};
        
    fieldConfig.forEach(field => {
        if (quillEditors[field.key]) {
            formData[field.key] = quillEditors[field.key].root.innerHTML;
        } else {
            const el = document.getElementById(`input-${field.key}`);
            if (el) formData[field.key] = el.value.trim();
        }
    });

        
        if (!formData.name) {
            alert("❌ 寺院名は必須です");
            return;
        }
        
        if (!confirm("💾 保存してよろしいですか？")) return;
        
        try {
            let url = mode === 'add' ? '/add_temple' : '/update_temple';
            const res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ original_name: originalName, data: formData })
            });
            
            if (res.ok) {
                alert("✅ 保存しました！");
                closeModal('edit-modal');
                await loadList();
                await loadLogs();
            } else {
                const err = await res.json();
                alert("❌ エラー: " + err.message);
            }
        } catch (e) {
            alert("❌ 通信エラーが発生しました");
        }
    };

    async function deleteTemple(name) {
        if (!confirm(`🗑️ 本当に「${name}」を削除してもよろしいですか？\n\nこの操作は取り消せません。`)) return;
        
        try {
            const res = await fetch('/delete_temple', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: name })
            });
            
            if (res.ok) { 
                alert("✅ 削除しました"); 
                await loadList(); 
                await loadLogs(); 
            } else { 
                alert("❌ 削除に失敗しました"); 
            }
        } catch (e) {
            alert("❌ 通信エラーが発生しました");
        }
    }

    // モーダル外クリックで閉じる
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
            }
        });
    });

    // === CSV機能 ===
    async function exportCSV() {
        showLoading();
        try {
            window.location.href = '/export_csv';
            setTimeout(hideLoading, 1000);
        } catch (e) {
            hideLoading();
            alert('❌ エクスポートに失敗しました');
        }
    }

    async function importCSV() {
        const fileInput = document.getElementById('csv-file');
        const file = fileInput.files[0];
        
        if (!file) return;
        
        if (!confirm(`「${file.name}」をインポートしますか？\n既存データは上書きされます。`)) {
            fileInput.value = '';
            return;
        }
        
        showLoading();
        const formData = new FormData();
        formData.append('file', file);
        
        try {
            const res = await fetch('/import_csv', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (res.ok) {
                let message = `✅ インポート完了\n\n新規: ${data.imported}件\n更新: ${data.updated}件`;
                if (data.errors.length > 0) {
                    message += `\n\nエラー:\n${data.errors.join('\n')}`;
                }
                alert(message);
                await loadList();
                await loadLogs();
            } else {
                alert('❌ エラー: ' + data.message);
            }
        } catch (e) {
            alert('❌ インポートに失敗しました: ' + e.message);
        } finally {
            hideLoading();
            fileInput.value = '';
        }
    }

    // === アクセス統計 ===
    async function showAccessStats() {
        document.getElementById('stats-modal').classList.add('show');
        document.getElementById('stats-content').innerHTML = '読み込み中...';
        
        try {
            const res = await fetch('/get_access_stats');
            const data = await res.json();
            
            if (data.stats.length === 0) {
                document.getElementById('stats-content').innerHTML = '<p style="text-align:center; color:#999;">データがありません</p>';
                return;
            }
            
            let html = '<table style="width:100%; border-collapse:collapse;">';
            html += '<thead><tr style="background:#f5f5f5;"><th style="padding:10px; text-align:left;">順位</th><th style="padding:10px; text-align:left;">寺院名</th><th style="padding:10px; text-align:right;">閲覧回数</th></tr></thead>';
            html += '<tbody>';
            
            data.stats.forEach((item, index) => {
                const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}位`;
                html += `<tr style="border-bottom:1px solid #eee;">
                    <td style="padding:10px;">${medal}</td>
                    <td style="padding:10px; font-weight:600;">${item.name}</td>
                    <td style="padding:10px; text-align:right;">${item.count}回</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            document.getElementById('stats-content').innerHTML = html;
        } catch (e) {
            document.getElementById('stats-content').innerHTML = '<p style="text-align:center; color:#d32f2f;">データの取得に失敗しました</p>';
        }
    }

    // === コメント機能 ===
    let currentTempleForComment = '';

    async function openCommentModal(templeName) {
        currentTempleForComment = templeName;
        document.getElementById('comment-modal-title').textContent = `💬 ${templeName} のスタッフメモ`;
        document.getElementById('comment-modal').classList.add('show');
        document.getElementById('new-comment').value = '';
        await loadComments(templeName);
    }

    async function loadComments(templeName) {
        const container = document.getElementById('comments-list');
        container.innerHTML = '読み込み中...';
        
        try {
            const res = await fetch(`/get_comments/${encodeURIComponent(templeName)}`);
            const data = await res.json();
            
            if (data.comments.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#999; padding:20px;">まだメモがありません</p>';
                return;
            }
            
            let html = '';
            data.comments.forEach(comment => {
                html += `<div style="background:#f9f9f9; padding:12px; border-radius:8px; margin-bottom:10px; border-left:3px solid #1a237e;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                        <span style="font-weight:600; color:#1a237e;">${comment.user_name}</span>
                        <span style="font-size:0.85em; color:#666;">${comment.timestamp}</span>
                    </div>
                    <div style="color:#333; line-height:1.6;">${comment.comment}</div>
                </div>`;
            });
            
            container.innerHTML = html;
        } catch (e) {
            container.innerHTML = '<p style="text-align:center; color:#d32f2f;">読み込みに失敗しました</p>';
        }
    }

    async function addComment() {
        const commentText = document.getElementById('new-comment').value.trim();
        
        if (!commentText) {
            alert('メモを入力してください');
            return;
        }
        
        try {
            const res = await fetch('/add_comment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    temple_name: currentTempleForComment,
                    comment: commentText
                })
            });
            
            if (res.ok) {
                document.getElementById('new-comment').value = '';
                await loadComments(currentTempleForComment);
                await loadLogs();
            } else {
                const data = await res.json();
                alert('❌ エラー: ' + data.message);
            }
        } catch (e) {
            alert('❌ 送信に失敗しました');
        }
    }
</script>
</body>
</html>
