{#
  パスワード強度メーター コンポーネント
  
  使い方（他のHTMLから include するか、コピーして使う）:
    {% include 'components/password_strength.html' %}
  
  対象入力フィールドの id="new_password" に自動で適用される。
  別のIDを使う場合は JS の `targetInputId` を変更してください。
#}

<style>
/* ========== パスワード強度メーター ========== */
.pw-strength-wrap {
    margin-top: 0.5rem;
}

/* バー全体 */
.pw-strength-bar {
    height: 6px;
    border-radius: 3px;
    background: #e2e8f0;
    overflow: hidden;
    margin-bottom: 0.35rem;
}

/* 塗り部分（幅とカラーをJSで制御） */
.pw-strength-fill {
    height: 100%;
    width: 0%;
    border-radius: 3px;
    transition: width 0.3s ease, background-color 0.3s ease;
}

/* ラベル */
.pw-strength-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #718096;
    display: flex;
    justify-content: space-between;
}

/* 強度ごとのチェックリスト */
.pw-requirements {
    margin-top: 0.5rem;
    list-style: none;
    padding: 0;
    font-size: 0.78rem;
    color: #a0aec0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.2rem;
}
.pw-requirements li::before {
    content: '✗ ';
    color: #fc8181;
}
.pw-requirements li.ok::before {
    content: '✓ ';
    color: #68d391;
}
.pw-requirements li.ok {
    color: #2d3748;
}
</style>

<!-- 強度バー -->
<div class="pw-strength-wrap" id="pwStrengthWrap" style="display:none">
    <div class="pw-strength-bar">
        <div class="pw-strength-fill" id="pwStrengthFill"></div>
    </div>
    <div class="pw-strength-label">
        <span>パスワード強度</span>
        <span id="pwStrengthText">-</span>
    </div>
    <!-- 要件チェックリスト -->
    <ul class="pw-requirements" id="pwRequirements">
        <li id="req-length">8文字以上</li>
        <li id="req-lower">小文字 (a-z)</li>
        <li id="req-upper">大文字 (A-Z)</li>
        <li id="req-digit">数字 (0-9)</li>
    </ul>
</div>

<script>
(() => {
    // ★ 対象入力フィールドのID（変更可）
    const targetInputId = 'new_password';

    const input    = document.getElementById(targetInputId);
    const wrap     = document.getElementById('pwStrengthWrap');
    const fill     = document.getElementById('pwStrengthFill');
    const label    = document.getElementById('pwStrengthText');
    const reqItems = {
        length : document.getElementById('req-length'),
        lower  : document.getElementById('req-lower'),
        upper  : document.getElementById('req-upper'),
        digit  : document.getElementById('req-digit'),
    };

    if (!input) return; // 入力フィールドが存在しない場合はスキップ

    input.addEventListener('input', () => {
        const pw = input.value;

        if (pw.length === 0) {
            wrap.style.display = 'none';
            return;
        }
        wrap.style.display = 'block';

        // ========== 各要件チェック ==========
        const checks = {
            length : pw.length >= 8,
            lower  : /[a-z]/.test(pw),
            upper  : /[A-Z]/.test(pw),
            digit  : /[0-9]/.test(pw),
        };

        // チェックリストのUIを更新
        for (const [key, ok] of Object.entries(checks)) {
            reqItems[key].classList.toggle('ok', ok);
        }

        // ========== スコア計算（0〜4点）==========
        const score = Object.values(checks).filter(Boolean).length;

        // スコアに応じたカラーとラベル
        const levels = [
            { color: '#fc8181', text: '非常に弱い', pct: '15%' },  // 0
            { color: '#f6ad55', text: '弱い',       pct: '35%' },  // 1
            { color: '#faf089', text: '普通',        pct: '60%' },  // 2
            { color: '#68d391', text: '強い',        pct: '80%' },  // 3
            { color: '#38a169', text: '非常に強い',  pct: '100%' }, // 4
        ];

        const level = levels[score];
        fill.style.width           = level.pct;
        fill.style.backgroundColor = level.color;
        label.textContent          = level.text;
        label.style.color          = level.color;
    });
})();
</script>
