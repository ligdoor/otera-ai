{#
  パスワード変更フォーム コンポーネント
  
  管理画面（admin.html など）の body 内に貼り付けて使う。
  
  依存: components/password_strength.html
#}

<!-- ====== パスワード変更モーダル ====== -->
<div id="changePasswordModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="cpwTitle">
    <div class="modal-box">
        <div class="modal-header">
            <h2 id="cpwTitle">🔑 パスワード変更</h2>
            <button class="modal-close" onclick="closeChangePasswordModal()" aria-label="閉じる">✕</button>
        </div>

        <div class="modal-body">
            <!-- フィードバックメッセージ -->
            <div id="cpwMsg" class="cpw-msg" style="display:none"></div>

            <form id="changePasswordForm" novalidate>
                <!-- CSRF トークン -->
                <input type="hidden" name="csrf_token" id="cpwCsrfToken" value="">

                <!-- 現在のパスワード -->
                <div class="cpw-field">
                    <label for="current_password">現在のパスワード</label>
                    <div class="input-wrap">
                        <input type="password" id="current_password" name="current_pass"
                               placeholder="現在のパスワード" autocomplete="current-password" required>
                    </div>
                </div>

                <!-- 新しいパスワード -->
                <div class="cpw-field">
                    <label for="new_password">新しいパスワード</label>
                    <div class="input-wrap">
                        <input type="password" id="new_password" name="new_pass"
                               placeholder="8文字以上・英数字混在" autocomplete="new-password" required>
                    </div>
                    <!-- パスワード強度メーター -->
                    {% include 'components/password_strength.html' %}
                </div>

                <!-- 新しいパスワード（確認） -->
                <div class="cpw-field">
                    <label for="confirm_password">新しいパスワード（確認）</label>
                    <div class="input-wrap">
                        <input type="password" id="confirm_password" name="confirm_pass"
                               placeholder="もう一度入力" autocomplete="new-password" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="cpwSubmit">変更する</button>
            </form>
        </div>
    </div>
</div>

<style>
/* ========== パスワード変更モーダル ========== */
.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
}
.modal-box {
    background: #fff;
    border-radius: 12px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
}
.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 1.5rem;
    background: #f7fafc;
    border-bottom: 1px solid #e2e8f0;
}
.modal-header h2 { font-size: 1.1rem; font-weight: 700; color: #2d3436; }
.modal-close {
    background: none; border: none; cursor: pointer;
    font-size: 1.1rem; color: #a0aec0; padding: 0.25rem;
}
.modal-close:hover { color: #e53e3e; }

.modal-body { padding: 1.5rem; }

.cpw-field { margin-bottom: 1.25rem; }
.cpw-field label {
    display: block; font-size: 0.85rem; font-weight: 600;
    color: #4a5568; margin-bottom: 0.4rem;
}
.cpw-field input {
    width: 100%; padding: 0.7rem 0.85rem;
    border: 1.5px solid #e2e8f0; border-radius: 8px;
    font-size: 0.95rem;
    transition: border-color 0.2s;
    -webkit-appearance: none;
}
.cpw-field input:focus {
    outline: none;
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
}

.cpw-msg {
    border-radius: 8px;
    padding: 0.7rem 1rem;
    margin-bottom: 1rem;
    font-size: 0.875rem;
}
.cpw-msg.success { background: #f0fff4; border: 1px solid #68d391; color: #276749; }
.cpw-msg.error   { background: #fff5f5; border: 1px solid #fc8181; color: #c53030; }

.btn-primary {
    width: 100%;
    padding: 0.8rem;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none; border-radius: 8px;
    font-size: 0.95rem; font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s;
    margin-top: 0.5rem;
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
</style>

<script>
// ========== モーダル開閉 ==========
function openChangePasswordModal() {
    const modal = document.getElementById('changePasswordModal');
    modal.style.display = 'flex';
    // CSRFトークンを動的に設定
    const token = document.querySelector('meta[name="csrf-token"]');
    if (token) {
        document.getElementById('cpwCsrfToken').value = token.content;
    }
    document.getElementById('current_password').focus();
}

function closeChangePasswordModal() {
    document.getElementById('changePasswordModal').style.display = 'none';
    document.getElementById('changePasswordForm').reset();
    const msg = document.getElementById('cpwMsg');
    msg.style.display = 'none';
    msg.className = 'cpw-msg';
}

// ESCキーで閉じる
document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeChangePasswordModal();
});

// ========== フォーム送信 ==========
document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const currentPass = document.getElementById('current_password').value;
    const newPass     = document.getElementById('new_password').value;
    const confirmPass = document.getElementById('confirm_password').value;
    const msgEl       = document.getElementById('cpwMsg');
    const submitBtn   = document.getElementById('cpwSubmit');

    // ---- クライアントバリデーション ----
    if (newPass !== confirmPass) {
        showCpwMsg('新しいパスワードが一致しません。', 'error');
        return;
    }
    if (newPass.length < 8 || !/[0-9]/.test(newPass) || !/[a-zA-Z]/.test(newPass)) {
        showCpwMsg('パスワードは8文字以上で、英字と数字を含めてください。', 'error');
        return;
    }

    // ---- API 送信 ----
    submitBtn.disabled = true;
    submitBtn.textContent = '変更中…';

    try {
        const csrfToken = document.getElementById('cpwCsrfToken').value
                       || document.querySelector('meta[name="csrf-token"]')?.content
                       || '';

        const res = await fetch('/change_password', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRF-Token': csrfToken
            },
            body: JSON.stringify({
                current_pass: currentPass,
                new_pass: newPass
            })
        });

        const data = await res.json();

        if (res.ok && data.status === 'success') {
            showCpwMsg('✅ パスワードを変更しました。', 'success');
            document.getElementById('changePasswordForm').reset();
            // 2秒後にモーダルを閉じる
            setTimeout(closeChangePasswordModal, 2000);
        } else {
            showCpwMsg(data.message || '変更に失敗しました。', 'error');
        }
    } catch {
        showCpwMsg('通信エラーが発生しました。もう一度試してください。', 'error');
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '変更する';
    }
});

function showCpwMsg(text, type) {
    const el = document.getElementById('cpwMsg');
    el.textContent = (type === 'error' ? '⚠️ ' : '') + text;
    el.className = 'cpw-msg ' + type;
    el.style.display = 'block';
}
</script>
