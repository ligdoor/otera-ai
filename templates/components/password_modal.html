<!-- パスワード変更モーダル -->
<div id="pass-modal" class="modal">
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <h2>🔐 パスワード変更</h2>
            <button class="modal-close" onclick="closeModal('pass-modal')">&times;</button>
        </div>
        <form id="pass-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">現在のパスワード</label>
                    <input type="password" id="current-pass" class="form-input" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード</label>
                    <input type="password" id="new-pass" class="form-input" required autocomplete="new-password">
                    <!-- ★ パスワード強度メーター -->
                    <div id="pw-strength-wrap" style="display:none; margin-top:0.5rem;">
                        <div style="height:5px; background:#e2d9c8; border-radius:3px; overflow:hidden; margin-bottom:0.3rem;">
                            <div id="pw-strength-fill" style="height:100%; width:0%; border-radius:3px; transition:width 0.3s, background-color 0.3s;"></div>
                        </div>
                        <div style="display:flex; justify-content:space-between; font-size:0.72rem; color:#6b5b45;">
                            <span>強度</span>
                            <span id="pw-strength-label" style="font-weight:700;">-</span>
                        </div>
                        <ul style="list-style:none; padding:0; margin:0.3rem 0 0; font-size:0.75rem; display:grid; grid-template-columns:1fr 1fr; gap:2px;">
                            <li id="pr-len"  style="color:#9e8c78;">✗ 8文字以上</li>
                            <li id="pr-num"  style="color:#9e8c78;">✗ 数字含む</li>
                            <li id="pr-alpha"style="color:#9e8c78;">✗ 英字含む</li>
                            <li id="pr-upper"style="color:#9e8c78;">✗ 大文字含む</li>
                        </ul>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード（確認）</label>
                    <input type="password" id="new-pass-confirm" class="form-input" required autocomplete="new-password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('pass-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span class="icon">🔒</span>
                    変更する
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// ★ パスワード強度メーター
// DOMContentLoadedに依存しない書き方（includeで後から読み込まれても動作する）
(function initPwStrength() {
    function setup() {
        var input = document.getElementById('new-pass');
        var wrap  = document.getElementById('pw-strength-wrap');
        var fill  = document.getElementById('pw-strength-fill');
        var lbl   = document.getElementById('pw-strength-label');
        var reqs  = {
            len:   document.getElementById('pr-len'),
            num:   document.getElementById('pr-num'),
            alpha: document.getElementById('pr-alpha'),
            upper: document.getElementById('pr-upper'),
        };
        if (!input || !wrap) return;

        // 既にイベント登録済みならスキップ
        if (input.dataset.pwInit) return;
        input.dataset.pwInit = '1';

        input.addEventListener('input', function() {
            var pw = this.value;
            if (!pw) { wrap.style.display = 'none'; return; }
            wrap.style.display = 'block';

            var ok = {
                len:   pw.length >= 8,
                num:   /[0-9]/.test(pw),
                alpha: /[a-z]/.test(pw),
                upper: /[A-Z]/.test(pw),
            };

            // 要件チェックマーク更新
            var labels = { len:'8文字以上', num:'数字含む', alpha:'英字含む', upper:'大文字含む' };
            for (var k in ok) {
                var el = reqs[k];
                if (!el) continue;
                el.textContent = (ok[k] ? '✓ ' : '✗ ') + labels[k];
                el.style.color = ok[k] ? '#2d6a4f' : '#9e8c78';
            }

            // スコア計算
            var score = Object.values(ok).filter(Boolean).length;
            var lvl = [
                { c:'#fc8181', t:'非常に弱い', w:'15%'  },
                { c:'#f6ad55', t:'弱い',       w:'35%'  },
                { c:'#ecc94b', t:'普通',        w:'60%'  },
                { c:'#68d391', t:'強い',        w:'80%'  },
                { c:'#38a169', t:'非常に強い',  w:'100%' },
            ][score];
            fill.style.width = lvl.w;
            fill.style.backgroundColor = lvl.c;
            lbl.textContent = lvl.t;
            lbl.style.color = lvl.c;
        });
    }

    // 即時実行 + openPassModal から呼ばれることも考慮
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setup);
    } else {
        setup();
    }

    // openPassModal が呼ばれるたびに再初期化（reset後にも動くように）
    var origOpen = window.openPassModal;
    window.openPassModal = function() {
        if (origOpen) origOpen();
        setTimeout(setup, 50);
    };
})();
</script>
