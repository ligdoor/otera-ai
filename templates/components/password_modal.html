<!-- パスワード変更モーダル -->
<div id="pass-modal" class="modal">
    <div class="modal-content" style="max-width:400px;">
        <div class="modal-header">
            <h2>🔐 パスワード変更</h2>
            <button class="modal-close" onclick="closeModal('pass-modal')">&times;</button>
        </div>
        <form id="pass-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">現在のパスワード</label>
                    <input type="password" id="current-pass" class="form-input" required autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード</label>
                    <input type="password" id="new-pass" class="form-input" required autocomplete="new-password">
                    <small style="color:#666; font-size:0.85em;">
                        8文字以上、英字と数字を含む
                    </small>
                </div>
                <div class="form-group">
                    <label class="form-label">新しいパスワード（確認）</label>
                    <input type="password" id="new-pass-confirm" class="form-input" required autocomplete="new-password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('pass-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span class="icon">🔒</span>
                    変更する
                </button>
            </div>
        </form>
    </div>
</div>
