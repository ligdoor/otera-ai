<!-- ログモーダル -->
<div id="log-modal" class="modal">
    <div class="modal-content" style="max-width: 1200px; max-height: 90vh;">
        <div class="modal-header">
            <h2>📋 システムログ</h2>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button onclick="filterLogs('all')" class="filter-btn active" data-filter="all">すべて</button>
                <button onclick="filterLogs('login')" class="filter-btn" data-filter="login">ログイン</button>
                <button onclick="filterLogs('edit')" class="filter-btn" data-filter="edit">編集</button>
                <button onclick="filterLogs('delete')" class="filter-btn" data-filter="delete">削除</button>
                <button onclick="refreshLogs()" class="btn btn-edit" style="margin-left: auto;">
                    <span class="icon">🔄</span>
                    <span>更新</span>
                </button>
                <button class="modal-close" onclick="closeModal('log-modal')">&times;</button>
            </div>
        </div>
        <div class="modal-body" style="max-height: 70vh; overflow-y: auto; padding: 0;">
            <table class="log-table" style="margin: 0;">
                <thead style="position: sticky; top: 0; background: white; z-index: 10;">
                    <tr>
                        <th>日時</th>
                        <th>担当</th>
                        <th>操作</th>
                        <th>詳細</th>
                    </tr>
                </thead>
                <tbody id="log-modal-list"></tbody>
            </table>
        </div>
    </div>
</div>
