<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="寺院情報管理システム">
    <meta name="theme-color" content="#4A90E2">
    <title>寺院情報管理システム - ログイン</title>
    <style>
        html, body { height: 100%; }
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100%; margin: 0; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .login-container { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #1a237e; margin-top: 0; margin-bottom: 30px; font-size: 1.8rem; }
        .lock-icon { font-size: 3rem; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 15px; margin-top: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.2s; }
        button:hover { transform: translateY(-2px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .register-link { display: block; width: 100%; padding: 15px; margin-top: 10px; background: white; color: #667eea; border: 2px solid #667eea; border-radius: 8px; font-size: 16px; font-weight: bold; text-decoration: none; text-align: center; transition: all 0.2s; box-sizing: border-box; }
        .register-link:hover { background: #f0f4ff; transform: translateY(-2px); }
        /* ★追加: パスワードリセットリンク用のスタイル */
        .links-container { margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0; }
        .password-reset-link { display: block; color: #667eea; text-decoration: none; font-size: 0.9rem; margin-top: 10px; transition: color 0.3s; }
        .password-reset-link:hover { color: #764ba2; text-decoration: underline; }
        .back-link { display: block; margin-top: 20px; color: #666; text-decoration: none; font-size: 0.9rem; }
        /* ★追加: 成功メッセージ用のスタイル */
        .success-message { padding: 14px 16px; margin-bottom: 20px; border-radius: 10px; text-align: center; font-size: 14px; background: #d4edda; color: #155724; border: 2px solid #c3e6cb; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .security-note { margin-top: 20px; padding: 10px; background: #fff3cd; border-left: 4px solid #ffc107; text-align: left; font-size: 0.85rem; color: #856404; }
        .loading-spinner { display: none; margin-top: 10px; }
        .loading-spinner.show { display: block; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #667eea; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="lock-icon">🔐</div>
        
        <!-- ★追加: 成功メッセージ表示 -->
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}
        
        <form method="post" id="login-form">
            <h2>セキュアログイン</h2>
            <input type="text" name="user_id" placeholder="ログインID" required autocomplete="username" id="user-id-input">
            <input type="password" name="password" placeholder="パスワード" required autocomplete="current-password" id="password-input">
            <button type="submit" id="login-button">ログイン</button>
            
            <!-- 新規登録ボタン -->
            <a href="/register" class="register-link">
                ✍️ 新規登録はこちら
            </a>
            
            <!-- ★追加: パスワードリセットリンク -->
            <div class="links-container">
                <a href="/password-reset-request" class="password-reset-link">
                    🔑 パスワードを忘れた方
                </a>
            </div>
            
            <div class="loading-spinner" id="loading-spinner">
                <div class="spinner"></div>
                <p style="margin-top:10px; color:#666;">ログイン中...</p>
            </div>
        </form>
        <div class="security-note">
            <strong>⚠️ セキュリティ</strong><br>
            3回失敗で警告通知<br>
            5回失敗で5分間ロック<br>
            30分無操作で自動ログアウト
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById('login-form');
        let isSubmitting = false;
        
        loginForm.addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }
            
            isSubmitting = true;
            
            const button = document.getElementById('login-button');
            const spinner = document.getElementById('loading-spinner');
            
            button.disabled = true;
            button.textContent = '処理中...';
            spinner.classList.add('show');
        });

        // ページ読み込み時の自動フォーカスを防ぐ
        document.addEventListener('DOMContentLoaded', function() {
            // すべての入力フィールドからフォーカスを外す
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.blur();
            });
            
            // body要素にフォーカスを移す
            document.body.focus();
        });
    </script>
</body>
</html>
