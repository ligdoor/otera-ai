<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/static/icons/icon-192.png">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="寺院情報管理システム">
    <meta name="theme-color" content="#4A90E2">
    <title>寺院情報管理システム - ログイン</title>
    
    <!-- 新CSS構成 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="lock-icon">🔐</div>
        
        {% if success %}
            <div class="success-message">{{ success }}</div>
        {% endif %}
        
        <form method="post" id="login-form">
            <h2>セキュアログイン</h2>
            
            <div class="form-group">
                <input type="text" name="user_id" class="form-input" placeholder="ログインID" required autocomplete="username" id="user-id-input">
            </div>
            
            <div class="form-group">
                <input type="password" name="password" class="form-input" placeholder="パスワード" required autocomplete="current-password" id="password-input">
            </div>
            
            <button type="submit" class="btn btn-primary btn-full" id="login-button">ログイン</button>
            
            <a href="/register" class="btn btn-outline btn-full">
                ✍️ 新規登録はこちら
            </a>
            
            <div class="links-container">
                <a href="/password-reset-request" class="password-reset-link">
                    🔑 パスワードを忘れた方
                </a>
            </div>
            
            <div class="auth-loading-spinner" id="loading-spinner">
                <div class="auth-spinner"></div>
                <p class="auth-loading-text">ログイン中...</p>
            </div>
        </form>
        
        <div class="security-note">
            <strong>⚠️ セキュリティ</strong><br>
            3回失敗で警告通知<br>
            5回失敗で5分間ロック<br>
            30分無操作で自動ログアウト
        </div>
    </div>
    
    <script>
        const loginForm = document.getElementById('login-form');
        let isSubmitting = false;
        
        loginForm.addEventListener('submit', function(e) {
            if (isSubmitting) {
                e.preventDefault();
                return false;
            }
            
            isSubmitting = true;
            
            const button = document.getElementById('login-button');
            const spinner = document.getElementById('loading-spinner');
            
            button.disabled = true;
            button.textContent = '処理中...';
            spinner.classList.add('show');
        });

        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.blur();
            });
            document.body.focus();
        });
    </script>
</body>
</html>
