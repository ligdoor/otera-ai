<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>

<header>
    <div class="header-content">
        <h1>
            <span>👥</span>
            ユーザー管理
        </h1>
        <!-- ★★★ 承認待ち一覧へのリンクを追加 ★★★ -->
        <a href="/pending-users" class="btn-primary" id="pending-users-btn" style="background: #ff9800; display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 8px; text-decoration: none; color: white; font-weight: bold;">
            <span>⏳ 承認待ち一覧</span>
            <span id="pending-count-badge" class="badge" style="background: #f44336; padding: 4px 8px; border-radius: 12px; font-size: 0.9rem; display: none;"></span>
        </a>
    </div>
        <a href="/admin" class="header-btn">
            <span>←</span>
            <span>管理画面へ</span>
        </a>
    </div>
</header>

<main>
    <!-- 権限説明 -->
    <div class="role-info">
        <div class="role-card admin">
            <h3><span>🔐</span>管理者 (Admin)</h3>
            <ul>
                <li>全機能利用可能</li>
                <li>ユーザー管理</li>
                <li>項目設定変更</li>
            </ul>
        </div>
        <div class="role-card editor">
            <h3><span>✏️</span>編集者 (Editor)</h3>
            <ul>
                <li>寺院データの追加・編集・削除</li>
                <li>CSV インポート/エクスポート</li>
                <li>コメント追加</li>
            </ul>
        </div>
        <div class="role-card viewer">
            <h3><span>👁️</span>閲覧者 (Viewer)</h3>
            <ul>
                <li>データの閲覧のみ</li>
                <li>CSV エクスポート</li>
                <li>統計情報の確認</li>
            </ul>
        </div>
    </div>

    <button class="add-btn" onclick="openAddModal()">
        <span>➕</span>
        新規ユーザーを追加
    </button>

    <div class="user-table-container">
        <table class="user-table">
            <thead>
                <tr>
                    <th>ユーザーID</th>
                    <th>名前</th>
                    <th>権限</th>
                    <th>作成日時</th>
                    <th>最終ログイン</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="6" class="empty-state">読み込み中...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- 追加モーダル -->
<div id="add-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>➕ 新規ユーザー追加</h2>
            <button class="modal-close" onclick="closeModal('add-modal')">&times;</button>
        </div>
        <form id="add-form">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">ユーザーID *</label>
                    <input type="text" id="new-user-id" class="form-input" required placeholder="例: tanaka_taro">
                </div>
                <div class="form-group">
                    <label class="form-label">名前 *</label>
                    <input type="text" id="new-name" class="form-input" required placeholder="例: 田中太郎">
                </div>
                <div class="form-group">
                    <label class="form-label">パスワード *</label>
                    <input type="password" id="new-password" class="form-input" required minlength="8">
                    <small style="color:#666;">8文字以上</small>
                </div>
                <div class="form-group">
                    <label class="form-label">権限 *</label>
                    <select id="new-role" class="form-select" required>
                        <option value="viewer">👁️ 閲覧者 (Viewer)</option>
                        <option value="editor">✏️ 編集者 (Editor)</option>
                        <option value="admin">🔐 管理者 (Admin)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('add-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span>➕</span>
                    追加する
                </button>
            </div>
        </form>
    </div>
</div>

<!-- 権限変更モーダル -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>✏️ 権限変更</h2>
            <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
        </div>
        <form id="edit-form">
            <div class="modal-body">
                <input type="hidden" id="edit-user-id">
                <div class="form-group">
                    <label class="form-label">ユーザーID</label>
                    <input type="text" id="edit-user-id-display" class="form-input" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">名前</label>
                    <input type="text" id="edit-name-display" class="form-input" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">新しい権限 *</label>
                    <select id="edit-role" class="form-select" required>
                        <option value="viewer">👁️ 閲覧者 (Viewer)</option>
                        <option value="editor">✏️ 編集者 (Editor)</option>
                        <option value="admin">🔐 管理者 (Admin)</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-cancel" onclick="closeModal('edit-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-save">
                    <span>💾</span>
                    変更する
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// ページ読み込み時に承認待ち件数を取得
async function checkPendingUsers() {
    try {
        const response = await fetch('/api/pending-users-count');
        const data = await response.json();
        
        if (data.count > 0) {
            const badge = document.getElementById('pending-count-badge');
            if (badge) {
                badge.textContent = data.count;
                badge.style.display = 'inline-block';
            }
        }
    } catch (error) {
        console.error('Failed to check pending users:', error);
    }
}

// ページ読み込み時に実行
document.addEventListener('DOMContentLoaded', function() {
    checkPendingUsers();
    // 30秒ごとに更新
    setInterval(checkPendingUsers, 30000);
});
</script>

<script>
    let currentUserId = '';

    async function init() {
        try {
            // 現在のユーザー情報を取得
            const currentRes = await fetch('/get_current_user');
            const currentData = await currentRes.json();
            currentUserId = currentData.user_id;

            // ユーザー一覧を読み込み
            await loadUsers();
        } catch (e) {
            console.error(e);
            alert('❌ 初期化に失敗しました');
        }
    }
    init();

    async function loadUsers() {
        try {
            const res = await fetch('/get_users');
            const data = await res.json();
            
            const tbody = document.getElementById('user-list');
            tbody.innerHTML = '';
            
            if (data.users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="empty-state">ユーザーが登録されていません</td></tr>';
                return;
            }
            
            data.users.forEach(user => {
                const tr = document.createElement('tr');
                
                const roleMap = {
                    'admin': '🔐 管理者',
                    'editor': '✏️ 編集者',
                    'viewer': '👁️ 閲覧者'
                };
                
                const isSelf = user.user_id === currentUserId;
                const deleteBtn = isSelf 
                    ? '<span style="color:#999; font-size:0.85rem;">（本人）</span>'
                    : `<button class="btn btn-delete" onclick="deleteUser('${user.user_id}', '${user.name}')">🗑️ 削除</button>`;
                
                const editBtn = isSelf
                    ? ''
                    : `<button class="btn btn-edit" onclick="openEditModal('${user.user_id}', '${user.name}', '${user.role}')">✏️ 権限変更</button>`;
                
                tr.innerHTML = `
                    <td><strong>${user.user_id}</strong></td>
                    <td>${user.name}</td>
                    <td><span class="role-badge ${user.role}">${roleMap[user.role]}</span></td>
                    <td>${user.created_at || '-'}</td>
                    <td>${user.last_login || '-'}</td>
                    <td>${editBtn}${deleteBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            console.error(e);
            alert('❌ ユーザー一覧の読み込みに失敗しました');
        }
    }

    function openAddModal() {
        document.getElementById('add-modal').classList.add('show');
        document.getElementById('add-form').reset();
    }

    function openEditModal(userId, name, currentRole) {
        document.getElementById('edit-user-id').value = userId;
        document.getElementById('edit-user-id-display').value = userId;
        document.getElementById('edit-name-display').value = name;
        document.getElementById('edit-role').value = currentRole;
        document.getElementById('edit-modal').classList.add('show');
    }

    function closeModal(id) {
        document.getElementById(id).classList.remove('show');
    }

    document.getElementById('add-form').onsubmit = async function(e) {
        e.preventDefault();
        
        const userData = {
            user_id: document.getElementById('new-user-id').value.trim(),
            name: document.getElementById('new-name').value.trim(),
            password: document.getElementById('new-password').value,
            role: document.getElementById('new-role').value
        };
        
        if (!confirm(`ユーザー「${userData.name}」を追加しますか？`)) return;
        
        try {
            const res = await fetch('/add_user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(userData)
            });
            
            const data = await res.json();
            
            if (res.ok) {
                alert('✅ ユーザーを追加しました！');
                closeModal('add-modal');
                await loadUsers();
            } else {
                alert('❌ エラー: ' + data.message);
            }
        } catch (e) {
            alert('❌ 通信エラーが発生しました');
        }
    };

    document.getElementById('edit-form').onsubmit = async function(e) {
        e.preventDefault();
        
        const userId = document.getElementById('edit-user-id').value;
        const newRole = document.getElementById('edit-role').value;
        
        if (!confirm('権限を変更しますか？')) return;
        
        try {
            const res = await fetch('/update_user_role', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, role: newRole })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                alert('✅ 権限を変更しました！');
                closeModal('edit-modal');
                await loadUsers();
            } else {
                alert('❌ エラー: ' + data.message);
            }
        } catch (e) {
            alert('❌ 通信エラーが発生しました');
        }
    };

    async function deleteUser(userId, name) {
        if (!confirm(`本当に「${name}」を削除しますか？\n\nこの操作は取り消せません。`)) return;
        
        try {
            const res = await fetch('/delete_user', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                alert('✅ ユーザーを削除しました');
                await loadUsers();
            } else {
                alert('❌ エラー: ' + data.message);
            }
        } catch (e) {
            alert('❌ 通信エラーが発生しました');
        }
    }

    // モーダル外クリックで閉じる
    document.querySelectorAll('.modal').forEach(modal => {
        modal.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('show');
            }
        });
    });
</script>
</body>
</html>
