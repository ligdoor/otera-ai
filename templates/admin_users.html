<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザー管理 - 寺院情報管理システム</title>
    
    <!-- 新CSS構成 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout/common-layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/modals.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/cards.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/badges.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/admin-users.css') }}">
</head>
<body class="admin-page">

<header class="header-admin">
    <div class="header-content">
        <h1>
            <span>👥</span>
            ユーザー管理
        </h1>
        <div class="btn-group">
            <a href="/admin/pending-users" class="btn btn-warning btn-sm pending-btn">
                <span>⏳</span>
                承認待ち
                <span class="badge-light" id="pending-count-badge" style="display:none;">0</span>
            </a>
            <a href="/admin" class="btn btn-back">
                <span>←</span>
                管理画面に戻る
            </a>
        </div>
    </div>
</header>

<main class="container">
    <!-- 権限説明カード -->
    <div class="role-info">
        <div class="role-card card-bordered admin">
            <h3>
                <span>🔐</span>
                管理者
            </h3>
            <ul>
                <li>全ての操作権限</li>
                <li>ユーザー管理</li>
                <li>システム設定</li>
                <li>メンテナンスモード</li>
            </ul>
        </div>

        <div class="role-card card-bordered editor">
            <h3>
                <span>✏️</span>
                編集者
            </h3>
            <ul>
                <li>データの編集・追加</li>
                <li>CSV エクスポート</li>
                <li>統計情報の確認</li>
            </ul>
        </div>

        <div class="role-card card-bordered viewer">
            <h3>
                <span>👁️</span>
                閲覧者
            </h3>
            <ul>
                <li>データの閲覧のみ</li>
                <li>CSV エクスポート</li>
                <li>統計情報の確認</li>
            </ul>
        </div>
    </div>

    <!-- ユーザーテーブル -->
    <div class="user-table-container">
        <table class="user-table">
            <thead>
                <tr>
                    <th>ユーザーID</th>
                    <th>名前</th>
                    <th>メールアドレス</th>
                    <th>所属</th>
                    <th>権限</th>
                    <th>ステータス</th>
                    <th>作成日時</th>
                    <th>最終ログイン</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="user-list">
                <tr><td colspan="9" class="empty-state">読み込み中...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<!-- 編集モーダル -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>✏️ ユーザー情報編集</h2>
            <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
        </div>
        <form id="edit-form">
            <div class="modal-body">
                <input type="hidden" id="edit-user-id">
                
                <div class="form-group">
                    <label class="form-label">ユーザーID</label>
                    <input type="text" id="edit-user-id-display" class="form-input" disabled>
                </div>
                
                <div class="form-group">
                    <label class="form-label">名前 <span class="required">*</span></label>
                    <input type="text" id="edit-name" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">メールアドレス <span class="required">*</span></label>
                    <input type="email" id="edit-email" class="form-input" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">所属</label>
                    <input type="text" id="edit-department" class="form-input" placeholder="例: 総務部">
                </div>
                
                <div class="form-group">
                    <label class="form-label">権限 <span class="required">*</span></label>
                    <select id="edit-role" class="form-select" required>
                        <option value="viewer">👁️ 閲覧者 (Viewer)</option>
                        <option value="editor">✏️ 編集者 (Editor)</option>
                        <option value="admin">🔐 管理者 (Admin)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">ステータス <span class="required">*</span></label>
                    <select id="edit-status" class="form-select" required>
                        <option value="active">✅ 有効</option>
                        <option value="inactive">❌ 無効</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('edit-modal')">
                    キャンセル
                </button>
                <button type="submit" class="btn btn-primary">
                    <span>💾</span>
                    変更を保存
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// 承認待ち件数を取得
async function checkPendingUsers() {
    try {
        const response = await fetch('/api/pending-users-count');
        const data = await response.json();
        
        if (data.count > 0) {
            const badge = document.getElementById('pending-count-badge');
            if (badge) {
                badge.textContent = data.count;
                badge.style.display = 'inline-block';
            }
        }
    } catch (error) {
        console.error('Failed to check pending users:', error);
    }
}

document.addEventListener('DOMContentLoaded', function() {
    checkPendingUsers();
});

let currentUserId = '';

async function init() {
    try {
        const currentRes = await fetch('/get_current_user');
        const currentData = await currentRes.json();
        currentUserId = currentData.user_id;
        await loadUsers();
    } catch (e) {
        console.error(e);
        alert('❌ 初期化に失敗しました');
    }
}
init();

async function loadUsers() {
    try {
        const res = await fetch('/get_users');
        const data = await res.json();
        
        const tbody = document.getElementById('user-list');
        tbody.innerHTML = '';
        
        if (data.users.length === 0) {
            tbody.innerHTML = '<tr><td colspan="9" class="empty-state">ユーザーが登録されていません</td></tr>';
            return;
        }
        
        data.users.forEach(user => {
            const tr = document.createElement('tr');
            
            const roleMap = {
                'admin': '🔐 管理者',
                'editor': '✏️ 編集者',
                'viewer': '👁️ 閲覧者'
            };
            
            const status = user.status || 'active';
            const statusBadge = status === 'active' 
                ? '<span class="badge badge-active">✅ 有効</span>'
                : '<span class="badge badge-inactive">❌ 無効</span>';
            
            const isSelf = user.user_id === currentUserId;
            
            const buttons = isSelf 
                ? '<span class="badge-self">（本人）</span>'
                : `<button class="btn btn-info btn-sm" onclick="openEditModal('${user.user_id}', '${user.name}', '${user.email || ''}', '${user.department || ''}', '${user.role}', '${status}')">✏️ 編集</button>
                   <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.user_id}', '${user.name}')">🗑️ 削除</button>`;
            
            tr.innerHTML = `
                <td><strong>${user.user_id}</strong></td>
                <td>${user.name}</td>
                <td>${user.email || '-'}</td>
                <td>${user.department || '-'}</td>
                <td><span class="badge badge-role badge-${user.role}">${roleMap[user.role]}</span></td>
                <td>${statusBadge}</td>
                <td>${user.created_at ? user.created_at.substring(0, 10) : '-'}</td>
                <td>${user.last_login ? user.last_login.substring(0, 10) : '-'}</td>
                <td class="table-actions">${buttons}</td>
            `;
            tbody.appendChild(tr);
        });
    } catch (e) {
        console.error(e);
        alert('❌ ユーザー一覧の読み込みに失敗しました');
    }
}

function openEditModal(userId, name, email, department, currentRole, status) {
    document.getElementById('edit-user-id').value = userId;
    document.getElementById('edit-user-id-display').value = userId;
    document.getElementById('edit-name').value = name;
    document.getElementById('edit-email').value = email || '';
    document.getElementById('edit-department').value = department || '';
    document.getElementById('edit-role').value = currentRole;
    document.getElementById('edit-status').value = status || 'active';
    document.getElementById('edit-modal').classList.add('show');
}

function closeModal(id) {
    document.getElementById(id).classList.remove('show');
}

document.getElementById('edit-form').onsubmit = async function(e) {
    e.preventDefault();
    
    const userId = document.getElementById('edit-user-id').value;
    const updateData = {
        user_id: userId,
        name: document.getElementById('edit-name').value.trim(),
        email: document.getElementById('edit-email').value.trim(),
        department: document.getElementById('edit-department').value.trim(),
        role: document.getElementById('edit-role').value,
        status: document.getElementById('edit-status').value
    };
    
    if (!confirm('ユーザー情報を変更しますか？')) return;
    
    try {
        const res = await fetch('/update_user_role', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(updateData)
        });
        
        const data = await res.json();
        
        if (res.ok) {
            alert('✅ ユーザー情報を変更しました！');
            closeModal('edit-modal');
            await loadUsers();
        } else {
            alert('❌ エラー: ' + data.message);
        }
    } catch (e) {
        alert('❌ 通信エラーが発生しました');
    }
};

async function deleteUser(userId, name) {
    if (!confirm(`本当に「${name}」を削除しますか？\n\nこの操作は取り消せません。`)) return;
    
    try {
        const res = await fetch('/delete_user', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: userId })
        });
        
        const data = await res.json();
        
        if (res.ok) {
            alert('✅ ユーザーを削除しました');
            await loadUsers();
        } else {
            alert('❌ エラー: ' + data.message);
        }
    } catch (e) {
        alert('❌ 通信エラーが発生しました');
    }
}

document.querySelectorAll('.modal').forEach(modal => {
    modal.addEventListener('click', function(e) {
        if (e.target === this) {
            this.classList.remove('show');
        }
    });
});
</script>

</body>
</html>
