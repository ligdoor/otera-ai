<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - アクセス拒否 | AI寺院案内サイト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", Meiryo, sans-serif;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 1rem;
        }

        .error-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .error-title {
            font-size: 2rem;
            color: #fa709a;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 112, 154, 0.6);
        }

        .btn-secondary {
            background: white;
            color: #fa709a;
            border: 2px solid #fa709a;
        }

        .btn-secondary:hover {
            background: #fa709a;
            color: white;
        }

        .temple-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .info-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #f8f9fa;
            border-radius: 10px;
            text-align: left;
        }

        .info-box h3 {
            color: #fa709a;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .info-box ul {
            list-style: none;
            padding-left: 0;
        }

        .info-box li {
            padding: 0.5rem 0;
            color: #666;
        }

        .info-box li:before {
            content: "🔒";
            margin-right: 0.5rem;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .error-card {
                padding: 2rem 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">403</div>
        
        <div class="error-card">
            <div class="temple-icon">🔐</div>
            
            <h1 class="error-title">アクセスが拒否されました</h1>
            
            <p class="error-message">
                このページへのアクセス権限がありません。<br>
                ログインが必要か、適切な権限を持つアカウントでアクセスしてください。
            </p>

            <div class="button-group">
                <a href="/" class="btn btn-primary">🏠 トップページへ</a>
                <a href="/login" class="btn btn-secondary">🔑 ログイン</a>
            </div>

            <div class="info-box">
                <h3>アクセスが制限される理由</h3>
                <ul>
                    <li>ログインが必要なページです</li>
                    <li>管理者権限が必要なページです</li>
                    <li>セッションの有効期限が切れています</li>
                    <li>アクセス権限が不足しています</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
