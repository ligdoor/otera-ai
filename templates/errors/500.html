<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - サーバーエラー | AI寺院案内サイト</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN W3", Meiryo, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .error-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .error-code {
            font-size: 8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 4px 8px rgba(0,0,0,0.2);
            margin-bottom: 1rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .error-card {
            background: white;
            border-radius: 20px;
            padding: 3rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .error-title {
            font-size: 2rem;
            color: #f5576c;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .error-message {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 0.8rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
            font-size: 1rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
        }

        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }

        .btn-secondary:hover {
            background: #f5576c;
            color: white;
        }

        .temple-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .info-box {
            margin-top: 2rem;
            padding: 1.5rem;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 10px;
            text-align: left;
        }

        .info-box h3 {
            color: #856404;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .info-box p {
            color: #856404;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .error-card {
                padding: 2rem 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        
        <div class="error-card">
            <div class="temple-icon">⚠️</div>
            
            <h1 class="error-title">サーバーエラーが発生しました</h1>
            
            <p class="error-message">
                申し訳ございません。サーバー側で予期しないエラーが発生しました。<br>
                しばらく時間をおいてから再度お試しください。
            </p>

            <div class="button-group">
                <a href="/" class="btn btn-primary">🏠 トップページへ</a>
                <a href="javascript:location.reload()" class="btn btn-secondary">🔄 ページを再読み込み</a>
            </div>

            <div class="info-box">
                <h3>💡 問題が解決しない場合</h3>
                <p>
                    ・ブラウザのキャッシュをクリアしてみてください<br>
                    ・別のブラウザで試してみてください<br>
                    ・問題が継続する場合は管理者にお問い合わせください
                </p>
            </div>
        </div>
    </div>
</body>
</html>
