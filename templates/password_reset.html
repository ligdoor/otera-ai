<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワード設定 - 寺院管理システム</title>
    
    <!-- 新CSS構成 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/variables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base/reset.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/buttons.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pages/auth.css') }}">
    
    <style>
        .password-requirements {
            margin-top: var(--spacing-xs);
            font-size: var(--font-sm);
            color: var(--color-gray-600);
        }
        .password-match {
            margin-top: var(--spacing-xs);
            font-size: var(--font-sm);
        }
        .password-match.match {
            color: var(--color-success);
        }
        .password-match.no-match {
            color: var(--color-error);
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="lock-icon">🔑</div>
        <h2>新しいパスワード設定</h2>
        <p class="subtitle">寺院管理システム</p>
        
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/password-reset/{{ token }}" id="resetForm">
            <div class="form-group">
                <label class="form-label" for="password">新しいパスワード</label>
                <input type="password" id="password" name="password" class="form-input" required 
                       minlength="8" placeholder="8文字以上で入力">
                <div class="password-requirements">
                    ✓ 8文字以上で設定してください
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password_confirm">新しいパスワード（確認）</label>
                <input type="password" id="password_confirm" name="password_confirm" 
                       class="form-input" required minlength="8" placeholder="もう一度入力">
                <div class="password-match" id="matchMessage"></div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-full">
                🔒 パスワードを変更
            </button>
        </form>
    </div>

    <script>
        const password = document.getElementById('password');
        const passwordConfirm = document.getElementById('password_confirm');
        const matchMessage = document.getElementById('matchMessage');
        const form = document.getElementById('resetForm');
        
        function checkPasswordMatch() {
            if (passwordConfirm.value === '') {
                matchMessage.className = 'password-match';
                matchMessage.textContent = '';
                return;
            }
            
            if (password.value === passwordConfirm.value) {
                matchMessage.className = 'password-match match';
                matchMessage.textContent = '✓ パスワードが一致しています';
            } else {
                matchMessage.className = 'password-match no-match';
                matchMessage.textContent = '✗ パスワードが一致しません';
            }
        }
        
        password.addEventListener('input', checkPasswordMatch);
        passwordConfirm.addEventListener('input', checkPasswordMatch);
        
        form.addEventListener('submit', function(e) {
            if (password.value !== passwordConfirm.value) {
                e.preventDefault();
                alert('パスワードが一致しません');
                return false;
            }
            
            if (password.value.length < 8) {
                e.preventDefault();
                alert('パスワードは8文字以上で設定してください');
                return false;
            }
        });
    </script>
</body>
</html>
