<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新しいパスワード設定 - 寺院管理システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .reset-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 450px;
            width: 100%;
            padding: 40px;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: inherit;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 8px;
            line-height: 1.5;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        
        .password-requirements ul {
            margin-top: 5px;
            padding-left: 20px;
        }
        
        .password-requirements li {
            margin: 3px 0;
        }
        
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-submit:active {
            transform: translateY(0);
        }
        
        .message {
            padding: 14px 16px;
            margin-bottom: 25px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            animation: slideDown 0.3s ease;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .icon {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .password-match {
            font-size: 12px;
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
        }
        
        .password-match.match {
            display: block;
            background: #d4edda;
            color: #155724;
        }
        
        .password-match.no-match {
            display: block;
            background: #f8d7da;
            color: #721c24;
        }
        
        @media (max-width: 480px) {
            .reset-container {
                padding: 30px 20px;
            }
            
            h2 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="icon">🔑</div>
        <h2>新しいパスワード設定</h2>
        <p class="subtitle">寺院管理システム</p>
        
        {% if error %}
            <div class="message error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/password-reset/{{ token }}" id="resetForm">
            <div class="form-group">
                <label for="password">新しいパスワード</label>
                <input type="password" id="password" name="password" required 
                       minlength="8" placeholder="8文字以上で入力">
                <div class="password-requirements">
                    ✓ 8文字以上で設定してください
                </div>
            </div>

            <div class="form-group">
                <label for="password_confirm">新しいパスワード（確認）</label>
                <input type="password" id="password_confirm" name="password_confirm" 
                       required minlength="8" placeholder="もう一度入力">
                <div class="password-match" id="matchMessage"></div>
            </div>
            
            <button type="submit" class="btn-submit">パスワードを変更</button>
        </form>
    </div>

    <script>
        // パスワード一致確認
        const password = document.getElementById('password');
        const passwordConfirm = document.getElementById('password_confirm');
        const matchMessage = document.getElementById('matchMessage');
        const form = document.getElementById('resetForm');
        
        function checkPasswordMatch() {
            if (passwordConfirm.value === '') {
                matchMessage.className = 'password-match';
                matchMessage.textContent = '';
                return;
            }
            
            if (password.value === passwordConfirm.value) {
                matchMessage.className = 'password-match match';
                matchMessage.textContent = '✓ パスワードが一致しています';
            } else {
                matchMessage.className = 'password-match no-match';
                matchMessage.textContent = '✗ パスワードが一致しません';
            }
        }
        
        password.addEventListener('input', checkPasswordMatch);
        passwordConfirm.addEventListener('input', checkPasswordMatch);
        
        // フォーム送信時の最終チェック
        form.addEventListener('submit', function(e) {
            if (password.value !== passwordConfirm.value) {
                e.preventDefault();
                alert('パスワードが一致しません。もう一度確認してください。');
                passwordConfirm.focus();
            }
            
            if (password.value.length < 8) {
                e.preventDefault();
                alert('パスワードは8文字以上で設定してください。');
                password.focus();
            }
        });
    </script>
</body>
</html>
