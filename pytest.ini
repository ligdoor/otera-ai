[pytest]
# テストファイルのパターン
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# テストディレクトリ
testpaths = tests

# 出力オプション
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=modules
    --cov-report=html
    --cov-report=term-missing

# マーカー定義
markers =
    slow: 実行に時間がかかるテスト
    integration: 統合テスト
    unit: ユニットテスト
    db: データベースが必要なテスト
    redis: Redisが必要なテスト
    api: 外部APIを使用するテスト

# 警告フィルター
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# カバレッジ除外パターン
[coverage:run]
omit =
    */tests/*
    */conftest.py
    */__init__.py
    */venv/*

[coverage:report]
precision = 2
skip_empty = True
